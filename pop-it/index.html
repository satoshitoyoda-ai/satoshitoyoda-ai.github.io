<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<script>/* Visit counter (GoatCounter): counts how often this page is opened. No cookies; nothing identifies the player. Live site only. */(function(){if(!/\.github\.io$/.test(location.hostname)||navigator.webdriver)return;var p=location.pathname.replace(/index\.html$/,'');new Image().src='https://pikomori.goatcounter.com/count?p='+encodeURIComponent(p)+'&rnd='+Math.random().toString(36).slice(2);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#b983ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pop It!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  body {
    font-family: -apple-system, "Segoe UI", "Hiragino Maru Gothic ProN", "BIZ UDGothic", sans-serif;
    background: linear-gradient(160deg, #fdf1ff 0%, #e8f4ff 45%, #e9fff2 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.2vmin; padding: max(2vmin, env(safe-area-inset-top)) 2vmin 2vmin;
  }
  .hidden { display: none !important; }

  header {
    width: min(92vmin, 96vw);
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 {
    font-size: clamp(20px, 4.5vmin, 40px);
    color: #7a4fbf; letter-spacing: 1px;
    text-shadow: 0 2px 0 #fff;
  }
  .stats { display: flex; align-items: center; gap: 2vmin; }
  .flip-count {
    font-size: clamp(18px, 4vmin, 34px); font-weight: 700; color: #e6a817;
    background: #fff; border-radius: 999px; padding: 0.6vmin 2.2vmin;
    box-shadow: 0 2px 8px rgba(120, 80, 200, .15);
  }
  .flip-count.bump { animation: bump .5s ease; }
  @keyframes bump { 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .icon-btn {
    font-size: clamp(18px, 3.6vmin, 30px);
    background: #fff; border: none; border-radius: 999px;
    width: clamp(38px, 7vmin, 58px); height: clamp(38px, 7vmin, 58px);
    box-shadow: 0 2px 8px rgba(120, 80, 200, .15);
    cursor: pointer;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.off { opacity: .35; }

  /* ------- home & menu screens ------- */
  .menu {
    display: flex; flex-direction: column; gap: 3vmin; align-items: center;
    width: min(88vmin, 96vw);
  }
  .menu-title { font-size: clamp(18px, 4vmin, 34px); color: #9a8bc0; font-weight: 700; }
  .big-btn {
    width: 100%; border: none; cursor: pointer;
    border-radius: 5vmin; padding: 4.5vmin 3vmin;
    font-family: inherit;
    font-size: clamp(26px, 6.5vmin, 56px); font-weight: 800; color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,.25);
    box-shadow: 0 8px 20px rgba(90, 70, 180, .3), inset 0 3px 6px rgba(255,255,255,.5), inset 0 -6px 10px rgba(0,0,0,.15);
    transition: transform .1s;
  }
  .big-btn:active { transform: scale(.96); }
  .big-btn small { display: block; font-size: clamp(13px, 3vmin, 24px); font-weight: 600; opacity: .95; margin-top: 1vmin; }
  .btn-pop { background: linear-gradient(150deg, #ff9ecd 0%, #b983ff 100%); }
  .btn-challenge { background: linear-gradient(150deg, #4D96FF 0%, #6BCB77 100%); }
  .btn-numpath { background: linear-gradient(150deg, #ffb443 0%, #ff5a8a 100%); }
  .btn-make10 { background: linear-gradient(150deg, #35c2c9 0%, #4D96FF 100%); }
  .btn-quiz { background: linear-gradient(150deg, #ff8a5c 0%, #ffc93d 100%); }
  .btn-countdown { background: linear-gradient(150deg, #ff5a8a 0%, #b983ff 100%); }
  .btn-subtr { background: linear-gradient(150deg, #35c9a0 0%, #6BCB77 100%); }
  .big-btn.compact { padding: 2.4vmin 3vmin; font-size: clamp(20px, 4.8vmin, 40px); border-radius: 4vmin; }
  .big-btn.compact small { font-size: clamp(12px, 2.6vmin, 20px); margin-top: 0.5vmin; }
  .btn-back { background: linear-gradient(150deg, #c9c2dd 0%, #a99fc4 100%); font-size: clamp(18px, 4vmin, 32px); padding: 2.5vmin; }

  /* ------- goal banner ------- */
  .goal {
    width: min(88vmin, 96vw);
    background: #fff; border-radius: 3.5vmin;
    padding: 1.6vmin 3vmin;
    box-shadow: 0 4px 14px rgba(120, 80, 200, .18);
    display: flex; align-items: center; justify-content: space-between; gap: 2vmin;
    min-height: clamp(52px, 11vmin, 92px);
  }
  .goal-text { flex: 1; text-align: center; }
  .goal-main { font-size: clamp(17px, 4.2vmin, 36px); font-weight: 800; color: #5d4a8a; line-height: 1.25; }
  .goal-sub  { font-size: clamp(15px, 3.8vmin, 32px); font-weight: 800; color: #e6a817; min-height: 1.3em; }
  .goal-sub.gold { animation: goldflash .6s ease; }
  @keyframes goldflash { 30% { transform: scale(1.25); color: #ff9f1a; } 100% { transform: scale(1); } }
  .timer { font-size: clamp(15px, 3.6vmin, 30px); font-weight: 700; color: #4D96FF; min-width: 5.5em; text-align: right; }

  /* ------- board ------- */
  .board-wrap { perspective: 1200px; }
  .board {
    width: min(80vmin, 96vw);
    background: linear-gradient(155deg, #cfd6ff 0%, #b9c2f5 100%);
    border-radius: 5vmin;
    padding: 3vmin;
    box-shadow:
      0 10px 30px rgba(90, 70, 180, .28),
      inset 0 3px 6px rgba(255,255,255,.7),
      inset 0 -5px 10px rgba(60, 40, 140, .25);
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2vmin;
    transition: transform .3s ease-in;
  }
  .board.flip-out { transform: rotateY(90deg) scale(.92); }
  .board.flip-in  { transition: transform .35s cubic-bezier(.2, 1.6, .4, 1); transform: rotateY(0deg) scale(1); }

  .bubble {
    aspect-ratio: 1;
    border-radius: 50%;
    position: relative;
    transition: transform .08s;
  }
  .bubble::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 33% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 18%, transparent 40%),
      radial-gradient(circle at 50% 50%, var(--c-light) 0%, var(--c) 55%, var(--c-dark) 100%);
    box-shadow:
      0 4px 8px rgba(40, 20, 90, .35),
      inset 0 -4px 8px rgba(0,0,0,.18),
      inset 0 3px 5px rgba(255,255,255,.55);
  }
  .bubble.popped::before {
    background:
      radial-gradient(circle at 50% 62%, rgba(255,255,255,.28) 0%, transparent 45%),
      radial-gradient(circle at 50% 42%, var(--c-dark) 0%, var(--c-deep) 75%, var(--c-dark) 100%);
    box-shadow:
      inset 0 6px 10px rgba(20, 10, 60, .5),
      inset 0 -2px 4px rgba(255,255,255,.25),
      0 1px 0 rgba(255,255,255,.4);
  }
  .bubble.popping { animation: squish .16s ease-out; }
  @keyframes squish {
    0%   { transform: scale(1); }
    40%  { transform: scale(.72, .62); }
    100% { transform: scale(1); }
  }
  .bubble.shake { animation: shake .3s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6%); }
    50% { transform: translateX(6%); }
    75% { transform: translateX(-4%); }
  }
  .bubble.glow::before {
    box-shadow:
      0 0 3.5vmin 1vmin rgba(255, 255, 160, .95),
      0 4px 8px rgba(40, 20, 90, .35),
      inset 0 -4px 8px rgba(0,0,0,.18),
      inset 0 3px 5px rgba(255,255,255,.55);
    filter: brightness(1.25);
  }
  .bubble.selected { transform: scale(1.13); z-index: 2; }
  .bubble.selected::before {
    box-shadow:
      0 0 0 0.8vmin #fff, 0 0 3vmin 1vmin rgba(77, 150, 255, .8),
      0 4px 8px rgba(40, 20, 90, .35),
      inset 0 3px 5px rgba(255,255,255,.55);
  }
  .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(15px, 4.6vmin, 40px); font-weight: 800; color: #fff;
    text-shadow: 0 2px 3px rgba(0,0,0,.4);
    pointer-events: none; z-index: 1;
  }
  .bubble.popped .label { opacity: .35; }

  footer { font-size: clamp(12px, 2.4vmin, 18px); color: #a99fc4; }

  /* ------- celebration bits ------- */
  .star {
    position: fixed; font-size: 5vmin; pointer-events: none; z-index: 10;
    animation: fly 1s ease-out forwards;
  }
  @keyframes fly {
    0%   { transform: translate(0, 0) scale(.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(200deg); opacity: 0; }
  }
  .record-banner {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(150deg, #ffd93d, #ff9f43);
    color: #fff; font-size: clamp(26px, 7vmin, 64px); font-weight: 900;
    text-shadow: 0 3px 6px rgba(0,0,0,.3);
    padding: 3vmin 6vmin; border-radius: 4vmin; z-index: 20;
    box-shadow: 0 10px 40px rgba(230, 140, 0, .5);
    animation: recordpop 1.8s ease forwards; pointer-events: none;
    text-align: center; line-height: 1.3;
  }
  @keyframes recordpop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-8deg); }
    25% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
    35% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* ------- results overlay ------- */
  .overlay {
    position: fixed; inset: 0; z-index: 15;
    background: rgba(90, 70, 160, .35);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 5vmin; padding: 5vmin 7vmin;
    text-align: center; box-shadow: 0 16px 50px rgba(40, 20, 100, .4);
    display: flex; flex-direction: column; gap: 2.5vmin; align-items: center;
    max-width: 90vw;
  }
  .card .emoji { font-size: clamp(40px, 12vmin, 110px); }
  .card .time { font-size: clamp(24px, 6vmin, 52px); font-weight: 900; color: #5d4a8a; }
  .card .best { font-size: clamp(16px, 4vmin, 34px); font-weight: 700; color: #e6a817; }
  .card .row { display: flex; gap: 3vmin; }
  .card .big-btn { padding: 2.5vmin 5vmin; font-size: clamp(20px, 5vmin, 42px); width: auto; }
</style>
</head>
<body>

<header>
  <button class="icon-btn hidden" id="homeBtn" aria-label="home">🏠</button>
  <h1 id="title">Pop It! 🫧</h1>
  <div class="stats">
    <div class="flip-count" id="starCount">⭐ 0</div>
    <button class="icon-btn" id="bgmBtn" aria-label="music">🎵</button>
    <button class="icon-btn" id="soundBtn" aria-label="sound">🔊</button>
  </div>
</header>

<!-- HOME -->
<div class="menu" id="homeScreen">
  <div class="menu-title">Which game? / どっちであそぶ？</div>
  <button class="big-btn btn-pop" id="btnPop">🌈 Pop!<small>ふわふわポップ</small></button>
  <button class="big-btn btn-challenge" id="btnChallenge">⚡ Challenge<small>すうじチャレンジ</small></button>
</div>

<!-- CHALLENGE MENU -->
<div class="menu hidden" id="chMenu">
  <div class="menu-title">Pick a challenge! / チャレンジをえらぼう</div>
  <button class="big-btn btn-numpath compact" id="btnNumPath">🔢 Number Path<small id="npSub">1 → 15 じゅんばんポップ！</small></button>
  <button class="big-btn btn-countdown compact" id="btnCountdown">🔻 Countdown<small id="cdSub">15 → 1 ぎゃくじゅんポップ！</small></button>
  <button class="big-btn btn-make10 compact" id="btnMake10">➕ Make 10<small id="m10Sub">たして 10 を 5かい！</small></button>
  <button class="big-btn btn-subtr compact" id="btnSubtr">➖ Subtraction<small id="subSub">ひきざんペア さがし！</small></button>
  <button class="big-btn btn-quiz compact" id="btnQuiz">🧮 Quiz Pop<small id="quizSub">こたえさがし（＋ と −）</small></button>
  <button class="big-btn btn-back compact" id="btnChBack">⬅ Back / もどる</button>
</div>

<!-- PLAY -->
<div class="goal hidden" id="goalBanner">
  <div class="goal-text">
    <div class="goal-main" id="goalMain"></div>
    <div class="goal-sub" id="goalSub"></div>
  </div>
  <div class="timer hidden" id="timerEl"></div>
</div>

<div class="board-wrap hidden" id="boardWrap">
  <div class="board" id="board"></div>
</div>

<footer id="footerTip">pop pop pop! 🌈</footer>

<script>
(() => {
  const COLS = 6, ROWS = 6, N = COLS * ROWS;
  const PALETTE = [
    { name: 'red',    jp: 'あか',     dot: '🔴', c: '#ff5a5a', light: '#ff9d9d', dark: '#d63a3a', deep: '#8f1f1f' },
    { name: 'orange', jp: 'オレンジ', dot: '🟠', c: '#ff9f43', light: '#ffc98c', dark: '#e07f1f', deep: '#94510f' },
    { name: 'yellow', jp: 'きいろ',   dot: '🟡', c: '#ffd93d', light: '#ffe98c', dark: '#e0b81f', deep: '#94780f' },
    { name: 'green',  jp: 'みどり',   dot: '🟢', c: '#6BCB77', light: '#a4e3ac', dark: '#48a855', deep: '#276b30' },
    { name: 'blue',   jp: 'あお',     dot: '🔵', c: '#4D96FF', light: '#93bfff', dark: '#2f74d8', deep: '#1a468c' },
    { name: 'purple', jp: 'むらさき', dot: '🟣', c: '#B983FF', light: '#d6b8ff', dark: '#9459e0', deep: '#5c318f' },
  ];

  const $ = id => document.getElementById(id);
  const board = $('board');

  let stars = Number(localStorage.getItem('popit.flips') || 0);
  let muted = localStorage.getItem('popit.muted') === '1';
  let locked = false;
  let bubbles = [];
  let mode = null;        // current mode object
  let popGoalIdx = 0;     // rotation index within Pop mode

  $('starCount').textContent = '⭐ ' + stars;
  $('soundBtn').textContent = muted ? '🔇' : '🔊';

  // ================= audio =================
  let ctx = null;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      // iOS 17+: play through the ringer silent switch (otherwise WebAudio is
      // muted in silent mode while the speech voice still plays)
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function popSound(baseFreq) {
    if (muted) return;
    const ac = audio(), t = ac.currentTime;
    const f0 = (baseFreq || 520) + Math.random() * 160;
    // main "pock"
    const osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.08);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.55 + Math.random() * 0.15, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    osc.connect(g).connect(ac.destination);
    osc.start(t); osc.stop(t + 0.13);
    // low thump — gives the pop body on small tablet speakers
    const o2 = ac.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(190, t);
    o2.frequency.exponentialRampToValueAtTime(85, t + 0.07);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.001, t);
    g2.gain.exponentialRampToValueAtTime(0.5, t + 0.008);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o2.connect(g2).connect(ac.destination);
    o2.start(t); o2.stop(t + 0.1);
    // skin-texture click
    const len = ac.sampleRate * 0.02;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
    const ng = ac.createGain(); ng.gain.value = 0.15;
    src.connect(hp).connect(ng).connect(ac.destination);
    src.start(t);
  }
  function boing() {
    if (muted) return;
    const ac = audio(), t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(280, t);
    o.frequency.exponentialRampToValueAtTime(110, t + 0.18);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.22);
  }
  function chime() {
    if (muted) return;
    const ac = audio(), t = ac.currentTime;
    [880, 1174.66].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.001, t + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.28, t + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.4);
      o.connect(g).connect(ac.destination);
      o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.45);
    });
  }
  function fanfare(big) {
    if (muted) return;
    const ac = audio(), t = ac.currentTime;
    const notes = big ? [523.25, 659.25, 783.99, 1046.5, 1318.5] : [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.001, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.3, t + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.35);
      o.connect(g).connect(ac.destination);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.4);
    });
  }
  // ---- BGM: soft plucky loop (C–Am–F–G, pentatonic melody), quiet under the pops ----
  let bgmOn = localStorage.getItem('popit.bgm') !== '0'; // default on
  let bgmTimer = null, bgmStep = 0, bgmNext = 0;
  const BGM_STEP = 0.27; // ~111 bpm eighth notes
  const BGM_MELODY = [523.25, 659.25, 783.99, 880, 783.99, 659.25, 587.33, 659.25,
                      523.25, 659.25, 783.99, 1046.5, 880, 783.99, 659.25, 587.33];
  const BGM_BASS = [130.81, 110, 87.31, 98]; // C3 A2 F2 G2
  function bgmNote(f, t, peak, decay, type) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + decay + 0.05);
  }
  function bgmTick() {
    if (!ctx || muted || !bgmOn) return;
    const ahead = ctx.currentTime + 0.6;
    while (bgmNext < ahead) {
      const t = Math.max(bgmNext, ctx.currentTime + 0.02);
      bgmNote(BGM_MELODY[bgmStep % 16], t, 0.045, 0.24, 'triangle');
      if (bgmStep % 4 === 0) bgmNote(BGM_BASS[Math.floor(bgmStep / 4) % 4], t, 0.06, BGM_STEP * 3.6, 'sine');
      bgmNext += BGM_STEP;
      bgmStep++;
    }
  }
  function startBGM() {
    if (bgmTimer || !bgmOn || muted || !ctx) return;
    bgmNext = ctx.currentTime + 0.1;
    bgmTimer = setInterval(bgmTick, 200);
  }
  function stopBGM() {
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  }
  function ensureBGM() { audio(); startBGM(); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopBGM(); else if (ctx) ensureBGM();
  });

  function speak(text) {
    if (muted || !window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ================= board =================
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function rainbowColors() {
    const out = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) out.push(PALETTE[r]);
    return out;
  }
  function buildBoard(colors, labels) {
    board.innerHTML = '';
    bubbles = [];
    for (let i = 0; i < N; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const col = colors[i];
      b.style.setProperty('--c', col.c);
      b.style.setProperty('--c-light', col.light);
      b.style.setProperty('--c-dark', col.dark);
      b.style.setProperty('--c-deep', col.deep);
      b.dataset.color = col.name;
      b.dataset.idx = i;
      if (labels && labels[i] != null) {
        b.dataset.val = labels[i];
        const s = document.createElement('span');
        s.className = 'label';
        s.textContent = labels[i];
        b.appendChild(s);
      }
      board.appendChild(b);
      bubbles.push(b);
    }
  }
  function popBubble(b, freq) {
    b.classList.add('popped', 'popping');
    b.addEventListener('animationend', () => b.classList.remove('popping'), { once: true });
    popSound(freq);
    if (navigator.vibrate) navigator.vibrate(8);
  }
  function wrongBubble(b) {
    b.classList.add('shake');
    b.addEventListener('animationend', () => b.classList.remove('shake'), { once: true });
    boing();
  }

  // ================= input =================
  function bubbleAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const b = el && el.closest ? el.closest('.bubble') : null;
    return b;
  }
  const activePointers = new Set();
  board.addEventListener('pointerdown', e => {
    e.preventDefault();
    activePointers.add(e.pointerId);
    ensureBGM();
    const b = bubbleAt(e.clientX, e.clientY);
    if (b && mode && !locked) mode.press(b, 'tap');
  });
  window.addEventListener('pointermove', e => {
    if (!activePointers.has(e.pointerId)) return;
    const b = bubbleAt(e.clientX, e.clientY);
    if (b && mode && !locked && mode.drag) mode.press(b, 'drag');
  });
  const release = e => activePointers.delete(e.pointerId);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  board.addEventListener('contextmenu', e => e.preventDefault());

  // ================= celebration =================
  function starBurst() {
    const rect = board.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const emojis = ['⭐', '🌟', '✨', '💫'];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = emojis[i % emojis.length];
      const ang = (i / 14) * Math.PI * 2;
      const dist = 30 + Math.random() * 25;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
      document.body.appendChild(s);
      s.addEventListener('animationend', () => s.remove());
    }
  }
  function addStar() {
    stars++;
    localStorage.setItem('popit.flips', stars);
    const el = $('starCount');
    el.textContent = '⭐ ' + stars;
    el.classList.add('bump');
    el.addEventListener('animationend', () => el.classList.remove('bump'), { once: true });
  }
  function recordBanner(text) {
    const d = document.createElement('div');
    d.className = 'record-banner';
    d.innerHTML = text;
    document.body.appendChild(d);
    d.addEventListener('animationend', () => d.remove());
  }
  // flip the board, rebuild via callback while edge-on
  function flipBoard(rebuild, after) {
    locked = true;
    setTimeout(() => {
      board.classList.add('flip-out');
      setTimeout(() => {
        rebuild();
        board.classList.remove('flip-out');
        board.classList.add('flip-in');
        setTimeout(() => {
          board.classList.remove('flip-in');
          locked = false;
          if (after) after();
        }, 400);
      }, 320);
    }, 550);
  }
  function goalComplete(next) {
    addStar();
    fanfare();
    starBurst();
    flipBoard(next);
  }

  // ================= screens =================
  function showScreen(name) {
    $('homeScreen').classList.toggle('hidden', name !== 'home');
    $('chMenu').classList.toggle('hidden', name !== 'chmenu');
    const playing = name === 'play';
    $('goalBanner').classList.toggle('hidden', !playing);
    $('boardWrap').classList.toggle('hidden', !playing);
    $('homeBtn').classList.toggle('hidden', name === 'home');
    $('title').textContent = playing ? 'Pop It! 🫧' : 'Pop It! 🫧';
    if (!playing) { mode = null; stopTimer(); }
    const overlay = document.querySelector('.overlay');
    if (overlay) overlay.remove();
  }
  function setGoal(main, sub) {
    $('goalMain').innerHTML = main;
    $('goalSub').innerHTML = sub || '';
  }
  function setSub(text, gold) {
    const el = $('goalSub');
    el.innerHTML = text;
    if (gold) {
      el.classList.remove('gold');
      void el.offsetWidth;
      el.classList.add('gold');
    }
  }

  // ================= timer =================
  let timerStart = null, timerInt = null;
  function startTimer() {
    timerStart = performance.now();
    $('timerEl').classList.remove('hidden');
    timerInt = setInterval(() => {
      $('timerEl').textContent = '⏱ ' + ((performance.now() - timerStart) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function stopTimer() {
    if (timerInt) clearInterval(timerInt);
    timerInt = null;
    $('timerEl').classList.add('hidden');
    if (timerStart == null) return 0;
    const t = (performance.now() - timerStart) / 1000;
    timerStart = null;
    return t;
  }

  // ================= results (challenge) =================
  function showResult(gameKey, gameName, seconds, restart) {
    const key = 'popit.best.' + gameKey;
    const prev = Number(localStorage.getItem(key) || 0);
    const isRecord = !prev || seconds < prev;
    if (isRecord) localStorage.setItem(key, seconds.toFixed(1));
    addStar();
    fanfare(isRecord);
    starBurst();
    if (isRecord) recordBanner('🏆 NEW RECORD!<br>しんきろく！');
    const best = Number(localStorage.getItem(key));
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `
      <div class="card">
        <div class="emoji">${isRecord ? '🏆' : '🎉'}</div>
        <div class="time">⏱ ${seconds.toFixed(1)}s</div>
        <div class="best">Best / さいこう: ${best.toFixed(1)}s</div>
        <div class="row">
          <button class="big-btn btn-numpath" id="againBtn">🔁 Again!</button>
          <button class="big-btn btn-back" id="ovHomeBtn">🏠</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('#againBtn').addEventListener('click', () => { ov.remove(); restart(); });
    ov.querySelector('#ovHomeBtn').addEventListener('click', () => { ov.remove(); showScreen('home'); });
  }

  // ================= POP MODE (age 4) =================
  // rotating goals: free -> color -> count -> pattern -> ...
  const popGoals = [startFreePop, startColorPop, startCountPop, startPatternCopy];
  function nextPopGoal() {
    popGoalIdx = (popGoalIdx + 1) % popGoals.length;
    popGoals[popGoalIdx]();
  }
  function startPopMode() {
    popGoalIdx = 0;
    showScreen('play');
    popGoals[0]();
  }

  // --- 1. free pop ---
  function startFreePop() {
    buildBoard(rainbowColors(), null);
    let popped = 0, combo = 0, lastPop = 0;
    setGoal('🌈 Pop them all!', 'ぜんぶ ポップ！');
    speak('Pop them all!');
    mode = {
      drag: true,
      press(b) {
        if (b.classList.contains('popped')) return;
        // fast consecutive pops climb in pitch — the finger-drag reward
        const now = performance.now();
        combo = (now - lastPop < 600) ? combo + 1 : 0;
        lastPop = now;
        popBubble(b, 480 + Math.min(combo, 14) * 55);
        popped++;
        if (popped === N) goalComplete(nextPopGoal);
      }
    };
  }

  // --- 2. color pop ---
  function startColorPop() {
    const target = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    const others = PALETTE.filter(p => p !== target);
    const colors = [];
    for (let i = 0; i < 9; i++) colors.push(target);
    for (let i = 9; i < N; i++) colors.push(others[Math.floor(Math.random() * others.length)]);
    shuffle(colors);
    buildBoard(colors, null);
    let left = colors.filter(c => c === target).length;
    setGoal(`${target.dot} Pop all the <b style="color:${target.dark}">${target.name.toUpperCase()}</b>!`, `${target.jp}を ぜんぶ ポップ！`);
    speak(`Pop all the ${target.name} ones!`);
    mode = {
      drag: true,
      press(b, how) {
        if (b.classList.contains('popped')) return;
        if (b.dataset.color === target.name) {
          popBubble(b);
          left--;
          if (left === 0) goalComplete(nextPopGoal);
        } else if (how === 'tap') {
          wrongBubble(b); // drag over wrong colors is silently ignored
        }
      }
    };
  }

  // --- 3. count pop ---
  const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  function startCountPop() {
    const target = 3 + Math.floor(Math.random() * 7); // 3..9
    buildBoard(rainbowColors(), null);
    let count = 0;
    setGoal(`🖐 Pop ${target}!`, `${target}こ ポップ！ (0 / ${target})`);
    speak(`Pop ${target}!`);
    mode = {
      drag: true,
      press(b) {
        if (b.classList.contains('popped')) return;
        count++;
        popBubble(b, 400 + count * 40);
        speak(NUM_WORDS[Math.min(count, 10)] || String(count));
        setSub(`${target}こ ポップ！ (${count} / ${target})`, count === target);
        if (count >= target) {
          mode = null; // stop extra pops during celebration
          goalComplete(nextPopGoal);
        }
      }
    };
  }

  // --- 4. pattern copy ---
  const PATTERNS = [
    () => { const r = Math.floor(Math.random() * ROWS); return Array.from({length: COLS}, (_, c) => r * COLS + c); },       // row line
    () => { const c = Math.floor(Math.random() * COLS); return Array.from({length: ROWS}, (_, r) => r * COLS + c); },       // column line
    () => { const r = Math.floor(Math.random() * (ROWS - 1)), c = Math.floor(Math.random() * (COLS - 1));
            return [r * COLS + c, r * COLS + c + 1, (r + 1) * COLS + c, (r + 1) * COLS + c + 1]; },                          // 2x2 square
    () => Array.from({length: ROWS}, (_, i) => i * COLS + i),                                                                // diagonal ↘
    () => Array.from({length: ROWS}, (_, i) => i * COLS + (COLS - 1 - i)),                                                   // diagonal ↙
    () => [0, 5, 30, 35],                                                                                                    // four corners (easiest)
    () => [7, 10, 25, 26, 27, 28],                                                                                           // smiley (eyes + mouth)
    () => [1, 4, 6, 8, 9, 11, 13, 16, 20, 21],                                                                               // heart
    () => [0, 1, 2, 3, 4, 5, 8, 14, 20, 26, 32],                                                                             // letter T
    () => [1, 7, 13, 19, 25, 31, 32, 33, 34],                                                                                // letter L
    () => { const r = Math.floor(Math.random() * (ROWS - 1));
            return Array.from({length: COLS}, (_, c) => (c % 2 ? r + 1 : r) * COLS + c); },                                  // zigzag
  ];
  function startPatternCopy() {
    buildBoard(rainbowColors(), null);
    const pattern = new Set(PATTERNS[Math.floor(Math.random() * PATTERNS.length)]());
    let left = pattern.size, wrongs = 0, watching = true;
    setGoal('👀 Watch!', 'よくみてね…');
    speak('Watch!');
    pattern.forEach(i => bubbles[i].classList.add('glow'));
    const flash = ms => {
      watching = true;
      pattern.forEach(i => bubbles[i].classList.add('glow'));
      setTimeout(() => {
        pattern.forEach(i => bubbles[i].classList.remove('glow'));
        watching = false;
        setGoal('✋ Your turn — copy it!', 'おなじところを ポップ！');
      }, ms);
    };
    setTimeout(() => {
      pattern.forEach(i => bubbles[i].classList.remove('glow'));
      watching = false;
      setGoal('✋ Your turn — copy it!', 'おなじところを ポップ！');
      speak('Your turn!');
    }, 2500);
    mode = {
      drag: false,
      press(b) {
        if (watching || b.classList.contains('popped')) return;
        const i = Number(b.dataset.idx);
        if (pattern.has(i)) {
          popBubble(b);
          left--;
          if (left === 0) { mode = null; goalComplete(nextPopGoal); }
        } else {
          wrongBubble(b);
          wrongs++;
          if (wrongs >= 2) { wrongs = 0; flash(900); } // forgiving: re-show the pattern
        }
      }
    };
  }

  // ================= CHALLENGE (age 7) =================
  // --- number path sprints: 1→15 (ascending) and 15→1 (countdown), own records ---
  const PATH_MAX = 15;
  function startPath(asc) {
    showScreen('play');
    // only 15 bubbles carry numbers; the rest are plain filler — quick rounds
    const labels = new Array(N).fill(null);
    const spots = shuffle(Array.from({length: N}, (_, i) => i)).slice(0, PATH_MAX);
    spots.forEach((pos, i) => labels[pos] = i + 1);
    buildBoard(rainbowColors(), labels);
    let next = asc ? 1 : PATH_MAX, done = 0, started = false;
    setGoal(asc ? `🔢 Pop 1 → ${PATH_MAX} fast!` : `🔻 Countdown! ${PATH_MAX} → 1`, 'つぎ: ' + next);
    speak(asc ? 'Pop the numbers in order, fast!' : `Count down! Start at ${PATH_MAX}!`);
    mode = {
      drag: false,
      press(b) {
        if (b.classList.contains('popped')) return;
        if (Number(b.dataset.val) === next) {
          if (!started) { started = true; startTimer(); }
          done++;
          popBubble(b, 380 + done * 30); // pitch rises as you progress
          next += asc ? 1 : -1;
          if (done === PATH_MAX) {
            mode = null;
            const t = stopTimer();
            showResult(asc ? 'numberpath' : 'countdown', asc ? 'Number Path' : 'Countdown', t, () => startPath(asc));
          } else {
            setSub('つぎ: ' + next, done % 5 === 0);
          }
        } else {
          wrongBubble(b);
        }
      }
    };
  }

  // --- subtraction sprint: find pairs that are exactly d apart, 5 pairs to win ---
  const PAIRS_TO_WIN = 5;
  function startSubtraction() {
    showScreen('play');
    const d = 2 + Math.floor(Math.random() * 5); // difference target 2..6
    const labels = [];
    for (let i = 0; i < N / 2; i++) {
      const a = 1 + Math.floor(Math.random() * (18 - d));
      labels.push(a, a + d); // built from d-apart pairs, so matches always exist
    }
    shuffle(labels);
    buildBoard(rainbowColors(), labels);
    let first = null, pairs = 0, started = false;
    const prog = () => `ペア ${pairs} / ${PAIRS_TO_WIN}`;
    setGoal(`➖ Find pairs: ❓ − ❓ = ${d}`, prog());
    speak(`Find two numbers that are ${d} apart!`);
    mode = {
      drag: false,
      press(b) {
        if (b.classList.contains('popped')) return;
        if (!started) { started = true; startTimer(); }
        if (b === first) { // tap again to unselect
          b.classList.remove('selected');
          first = null;
          setSub(prog());
          return;
        }
        if (!first) {
          first = b;
          b.classList.add('selected');
          setSub(`${b.dataset.val} と … ❓`);
          return;
        }
        const x = Number(first.dataset.val), y = Number(b.dataset.val);
        const hi = Math.max(x, y), lo = Math.min(x, y);
        const f = first;
        first = null;
        if (hi - lo === d) {
          chime();
          setSub(`${hi} − ${lo} = ${d}! ✨`, true);
          [f, b].forEach(x2 => { x2.classList.remove('selected'); popBubble(x2); });
          pairs++;
          if (pairs >= PAIRS_TO_WIN) {
            mode = null;
            const t = stopTimer();
            showResult('subtraction', 'Subtraction', t, startSubtraction);
          } else {
            setTimeout(() => { if (mode) setSub(prog(), true); }, 700);
          }
        } else {
          boing();
          b.classList.add('selected');
          setSub(`${hi} − ${lo} = ${hi - lo} … ≠ ${d}`);
          setTimeout(() => {
            f.classList.remove('selected');
            b.classList.remove('selected');
            if (mode) setSub(prog());
          }, 700);
        }
      }
    };
  }

  // --- make 10 sprint: make ten 5 times, against the clock ---
  const TENS_TO_WIN = 5;
  function startMake10() {
    showScreen('play');
    const labels = [];
    for (let i = 0; i < N / 2; i++) {
      const a = 1 + Math.floor(Math.random() * 9);
      labels.push(a, 10 - a); // complementary pairs guarantee tens always exist
    }
    shuffle(labels);
    buildBoard(rainbowColors(), labels);
    let selected = [], tens = 0, started = false;
    const progress = () => `10 × ${tens} / ${TENS_TO_WIN}`;
    setGoal(`➕ Make 10 — ${TENS_TO_WIN} times!`, progress());
    speak('Make ten, five times!');
    const sumText = () => {
      if (!selected.length) return progress();
      const nums = selected.map(b => b.dataset.val);
      const sum = nums.reduce((s, v) => s + Number(v), 0);
      return nums.join(' + ') + ' = ' + sum;
    };
    mode = {
      drag: false,
      press(b) {
        if (b.classList.contains('popped')) return;
        if (!started) { started = true; startTimer(); }
        if (b.classList.contains('selected')) {
          b.classList.remove('selected');
          selected = selected.filter(x => x !== b);
          setSub(sumText());
          return;
        }
        b.classList.add('selected');
        selected.push(b);
        const sum = selected.reduce((s, x) => s + Number(x.dataset.val), 0);
        if (sum === 10) {
          chime();
          setSub(selected.map(x => x.dataset.val).join(' + ') + ' = 10! ✨', true);
          selected.forEach(x => { x.classList.remove('selected'); popBubble(x); });
          selected = [];
          tens++;
          if (tens >= TENS_TO_WIN) {
            mode = null;
            const t = stopTimer();
            showResult('make10', 'Make 10', t, startMake10);
          } else {
            setTimeout(() => { if (mode) setSub(progress(), true); }, 700);
          }
        } else if (sum > 10) {
          boing();
          setSub(sumText() + ' … too big! / おおきすぎ！');
          const toClear = selected;
          selected = [];
          setTimeout(() => {
            toClear.forEach(x => x.classList.remove('selected'));
            if (mode) setSub(progress());
          }, 600);
        } else {
          popSound(700);
          setSub(sumText());
        }
      }
    };
  }

  // --- quiz pop: 5 mixed +/− questions, find the answer bubble ---
  const QUIZ_COUNT = 5;
  function startQuizPop() {
    showScreen('play');
    // answers pool: 1..18 twice = 36 bubbles
    const labels = shuffle([...Array.from({length: 18}, (_, i) => i + 1), ...Array.from({length: 18}, (_, i) => i + 1)]);
    buildBoard(rainbowColors(), labels);
    let qNum = 0, answer = null, started = false;
    const liveVals = () => new Set(bubbles.filter(b => !b.classList.contains('popped')).map(b => Number(b.dataset.val)));
    function nextQuestion() {
      qNum++;
      const avail = liveVals();
      for (let tries = 0; tries < 60; tries++) {
        let a, b, ans, text, said;
        if (Math.random() < 0.5) {
          a = 1 + Math.floor(Math.random() * 9); b = 1 + Math.floor(Math.random() * 9);
          ans = a + b; text = `${a} + ${b} = ?`; said = `${a} plus ${b}`;
        } else {
          a = 2 + Math.floor(Math.random() * 17); b = 1 + Math.floor(Math.random() * (a - 1));
          ans = a - b; text = `${a} − ${b} = ?`; said = `${a} minus ${b}`;
        }
        if (ans >= 1 && ans <= 18 && avail.has(ans)) {
          answer = ans;
          setGoal('🧮 ' + text, `もんだい ${qNum} / ${QUIZ_COUNT}`);
          speak(said);
          return;
        }
      }
    }
    nextQuestion();
    mode = {
      drag: false,
      press(b) {
        if (b.classList.contains('popped')) return;
        if (!started) { started = true; startTimer(); }
        if (Number(b.dataset.val) === answer) {
          popBubble(b, 700);
          chime();
          if (qNum >= QUIZ_COUNT) {
            mode = null;
            const t = stopTimer();
            showResult('quizpop', 'Quiz Pop', t, startQuizPop);
          } else {
            nextQuestion();
          }
        } else {
          wrongBubble(b);
        }
      }
    };
  }

  // ================= challenge menu best times =================
  function updateChallengeMenu() {
    const fmt = k => {
      const v = localStorage.getItem('popit.best.' + k);
      return v ? ` · 🏆 ${v}s` : '';
    };
    $('npSub').textContent = '1 → 15 じゅんばんポップ！' + fmt('numberpath');
    $('cdSub').textContent = '15 → 1 ぎゃくじゅんポップ！' + fmt('countdown');
    $('m10Sub').textContent = 'たして 10 を 5かい！' + fmt('make10');
    $('subSub').textContent = 'ひきざんペア さがし！' + fmt('subtraction');
    $('quizSub').textContent = 'こたえさがし（＋ と −）' + fmt('quizpop');
  }

  // ================= wiring =================
  $('btnPop').addEventListener('click', () => { ensureBGM(); startPopMode(); });
  $('btnChallenge').addEventListener('click', () => { ensureBGM(); updateChallengeMenu(); showScreen('chmenu'); });
  $('btnChBack').addEventListener('click', () => showScreen('home'));
  $('btnNumPath').addEventListener('click', () => { ensureBGM(); startPath(true); });
  $('btnCountdown').addEventListener('click', () => { ensureBGM(); startPath(false); });
  $('btnMake10').addEventListener('click', () => { ensureBGM(); startMake10(); });
  $('btnSubtr').addEventListener('click', () => { ensureBGM(); startSubtraction(); });
  $('btnQuiz').addEventListener('click', () => { ensureBGM(); startQuizPop(); });
  $('homeBtn').addEventListener('click', () => showScreen('home'));
  $('soundBtn').addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem('popit.muted', muted ? '1' : '0');
    $('soundBtn').textContent = muted ? '🔇' : '🔊';
    if (muted) {
      stopBGM();
      if (window.speechSynthesis) speechSynthesis.cancel();
    } else {
      popSound();
      ensureBGM();
    }
  });
  $('bgmBtn').classList.toggle('off', !bgmOn);
  $('bgmBtn').addEventListener('click', () => {
    bgmOn = !bgmOn;
    localStorage.setItem('popit.bgm', bgmOn ? '1' : '0');
    $('bgmBtn').classList.toggle('off', !bgmOn);
    if (bgmOn) ensureBGM(); else stopBGM();
  });

  showScreen('home');
})();
</script>
</body>
