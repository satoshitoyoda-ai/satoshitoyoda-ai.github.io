<title>Draw With Me! 🎨</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --paper:#FFF7F2;
    --card:#FFFFFF;
    --ink:#5B4A43;
    --ink-soft:#9C8A82;
    --pink:#FF7BAC;
    --pink-deep:#F45B93;
    --blue:#7EC8E3;
    --yellow:#FFD670;
    --mint:#A8E6CF;
    --lav:#CDB4F0;
    --guide:#FF9EC4;
    --guide-done:#E3D7D1;
    --shadow:0 6px 0 rgba(91,74,67,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Chalkboard SE","Comic Sans MS","Comic Neue","Segoe UI",sans-serif;
    min-height:100vh;
    overscroll-behavior:none;
  }
  button{font-family:inherit; color:inherit; border:none; cursor:pointer; background:none; padding:0;}
  .screen{display:none; min-height:100vh;}
  .screen.active{display:flex; flex-direction:column;}

  /* ---------- HOME ---------- */
  #home{align-items:center; padding:24px 16px 48px;}
  .home-title{
    font-size:clamp(34px,7vw,54px);
    margin:18px 0 2px;
    color:var(--pink-deep);
    text-align:center;
    letter-spacing:1px;
    text-wrap:balance;
  }
  .home-sub{color:var(--ink-soft); font-size:clamp(15px,3vw,19px); margin:0 0 26px; text-align:center;}
  .card-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    max-width:720px;
  }
  .cat-title{
    font-size:clamp(19px,4vw,24px);
    color:var(--ink);
    margin:14px 4px 2px;
  }
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }
  .lesson-card{
    background:var(--card);
    border:3px solid #FFE1EC;
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:18px 10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .12s ease;
  }
  .lesson-card:active{transform:scale(.95);}
  .lesson-card .emoji{font-size:52px; line-height:1;}
  .lesson-card .name{font-size:19px;}
  .lesson-card .steps{font-size:13px; color:var(--ink-soft);}
  .lesson-card.free{border-color:#D6EFF9;}
  .home-actions{margin-top:26px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .big-btn{
    background:var(--blue);
    color:#fff;
    font-size:19px;
    padding:14px 26px;
    border-radius:999px;
    box-shadow:0 5px 0 rgba(91,74,67,.15);
  }
  .big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(91,74,67,.15);}
  .big-btn.pink{background:var(--pink);}

  /* ---------- DRAW ---------- */
  #draw{padding:10px 10px 16px; align-items:center; gap:10px;}
  .draw-top{
    width:100%; max-width:560px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .icon-btn{
    background:var(--card);
    border:3px solid #FFE1EC;
    border-radius:18px;
    box-shadow:var(--shadow);
    font-size:24px;
    width:54px; height:54px;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn.selected{border-color:var(--pink); background:#FFF0F6;}
  .draw-title{font-size:clamp(20px,4.5vw,26px); text-align:center; flex:1;}
  .tip{
    width:100%; max-width:560px;
    background:#FFF0D6;
    border:3px solid #FFE0A3;
    border-radius:18px;
    padding:10px 16px;
    font-size:clamp(15px,3.4vw,18px);
    text-align:center;
    min-height:48px;
    display:flex; align-items:center; justify-content:center;
  }
  .canvas-wrap{
    position:relative;
    width:min(92vw,480px);
    aspect-ratio:1/1;
    background:#fff;
    border:4px solid #FFD1E3;
    border-radius:24px;
    box-shadow:var(--shadow);
    overflow:hidden;
    touch-action:none;
  }
  .canvas-wrap canvas{position:absolute; inset:0; width:100%; height:100%;}
  #inkCanvas{touch-action:none;}
  .progress{display:flex; gap:8px; align-items:center; justify-content:center;}
  .dot{width:14px; height:14px; border-radius:50%; background:#EBDDD6; transition:background .2s;}
  .dot.done{background:var(--mint);}
  .dot.now{background:var(--pink); transform:scale(1.25);}
  .step-nav{display:flex; gap:12px; align-items:center; width:100%; max-width:560px; justify-content:center;}
  .nav-btn{
    background:var(--pink);
    color:#fff;
    font-size:20px;
    padding:13px 28px;
    border-radius:999px;
    box-shadow:0 5px 0 rgba(91,74,67,.15);
  }
  .nav-btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(91,74,67,.15);}
  .nav-btn.ghost{background:var(--card); color:var(--ink); border:3px solid #EBDDD6; box-shadow:var(--shadow);}
  .nav-btn:disabled{opacity:.35;}
  .toolbar{
    width:100%; max-width:560px;
    display:flex; flex-wrap:wrap; gap:8px;
    justify-content:center; align-items:center;
  }
  .swatch{
    width:44px; height:44px; border-radius:50%;
    border:3px solid rgba(91,74,67,.15);
    flex:none;
  }
  .swatch.selected{border-color:var(--ink); transform:scale(1.15);}
  .brush-btn{
    width:48px; height:48px; border-radius:16px;
    background:var(--card); border:3px solid #EBDDD6;
    display:flex; align-items:center; justify-content:center;
  }
  .brush-btn.selected{border-color:var(--pink); background:#FFF0F6;}
  .brush-dot{border-radius:50%; background:var(--ink);}
  .mode-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .mode-chip{
    background:var(--card); border:3px solid #EBDDD6;
    border-radius:999px; padding:8px 16px; font-size:15px;
  }
  .mode-chip.selected{border-color:var(--blue); background:#EAF7FC;}

  /* ---------- GALLERY ---------- */
  #gallery{padding:24px 16px 48px; align-items:center;}
  .gal-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:14px; width:100%; max-width:720px; margin-top:20px;
  }
  .gal-item{
    background:var(--card); border:3px solid #FFE1EC; border-radius:20px;
    box-shadow:var(--shadow); overflow:hidden; position:relative;
  }
  .gal-item img{width:100%; display:block; aspect-ratio:1/1; object-fit:cover;}
  .gal-item .cap{font-size:13px; text-align:center; padding:6px 4px; color:var(--ink-soft);}
  .gal-item .del{
    position:absolute; top:6px; right:6px;
    background:#fff; border-radius:50%; width:32px; height:32px;
    font-size:16px; box-shadow:0 2px 4px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
  }
  .gal-empty{color:var(--ink-soft); font-size:17px; margin-top:40px; text-align:center;}

  /* ---------- CELEBRATION ---------- */
  #party{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(91,74,67,.35);
    z-index:50;
  }
  #party.show{display:flex;}
  .party-card{
    background:var(--card); border-radius:30px; padding:26px 22px;
    max-width:340px; width:88%;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.2);
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
  .party-card h2{margin:0 0 8px; color:var(--pink-deep); font-size:30px;}
  .party-card img{width:100%; border-radius:18px; border:3px solid #FFE1EC; margin:8px 0 14px;}
  .confetti{position:fixed; top:-20px; font-size:26px; z-index:60; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
  @media (prefers-reduced-motion: reduce){
    .confetti{display:none;}
    .party-card{animation:none;}
  }
</style>

<!-- ================= HOME ================= -->
<div class="screen active" id="home">
  <h1 class="home-title">Draw With Me! 🎨</h1>
  <p class="home-sub">Pick a friend and let's draw, step by step!</p>
  <div class="card-grid" id="cardGrid"></div>
  <div class="home-actions">
    <button class="big-btn pink" onclick="openGallery()">🖼️ My Gallery</button>
  </div>
</div>

<!-- ================= DRAW ================= -->
<div class="screen" id="draw">
  <div class="draw-top">
    <button class="icon-btn" onclick="goHome()" aria-label="Home">🏠</button>
    <div class="draw-title" id="drawTitle">Kitty</div>
    <button class="icon-btn" id="peekBtn" aria-label="Peek at the guide">👀</button>
  </div>
  <div class="tip" id="tipBox"></div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="guideCanvas"></canvas>
    <canvas id="inkCanvas"></canvas>
  </div>
  <div class="progress" id="progress"></div>
  <div class="step-nav">
    <button class="nav-btn ghost" id="backBtn" onclick="prevStep()">⬅ Back</button>
    <button class="nav-btn" id="nextBtn" onclick="nextStep()">Next ➡</button>
  </div>
  <div class="toolbar" id="colorBar"></div>
  <div class="toolbar">
    <button class="brush-btn" data-size="4" aria-label="Thin brush"><span class="brush-dot" style="width:6px;height:6px"></span></button>
    <button class="brush-btn selected" data-size="8" aria-label="Medium brush"><span class="brush-dot" style="width:12px;height:12px"></span></button>
    <button class="brush-btn" data-size="16" aria-label="Thick brush"><span class="brush-dot" style="width:20px;height:20px"></span></button>
    <button class="icon-btn" id="eraserBtn" aria-label="Eraser">🧽</button>
    <button class="icon-btn" onclick="undo()" aria-label="Undo">↩️</button>
    <button class="icon-btn" onclick="clearInk()" aria-label="Start over">🗑️</button>
  </div>
  <div class="mode-row" id="modeRow">
    <button class="mode-chip selected" data-mode="trace">✏️ Trace</button>
    <button class="mode-chip" data-mode="hint">🌸 Hints</button>
    <button class="mode-chip" data-mode="memory">🌟 From memory</button>
  </div>
</div>

<!-- ================= GALLERY ================= -->
<div class="screen" id="gallery">
  <h1 class="home-title">My Gallery 🖼️</h1>
  <button class="big-btn" onclick="goHome()">🏠 Home</button>
  <div class="gal-grid" id="galGrid"></div>
  <p class="gal-empty" id="galEmpty">No drawings yet — go make your first masterpiece!</p>
</div>

<!-- ================= PARTY ================= -->
<div id="party">
  <div class="party-card">
    <h2 id="partyTitle">You did it! 🎉</h2>
    <img id="partyImg" alt="Your finished drawing">
    <p style="margin:0 0 14px; color:var(--ink-soft);">Saved to your gallery!</p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="big-btn pink" onclick="closeParty(); goHome();">🏠 Home</button>
      <button class="big-btn" onclick="closeParty(); restartLesson();">🔁 Again</button>
    </div>
  </div>
</div>

/* ============================================================
   STATE
   ============================================================ */
const COLORS = ['#3D3D3D','#FF7BAC','#F45B93','#FF9E5E','#FFD670','#8ED081','#7EC8E3','#5C8DE0','#CDB4F0','#B07D62','#FFFFFF'];
const CANVAS_SIZE = 400;
let currentLesson = null;   // lesson object or {free:true}
let stepIndex = 0;
let mode = 'trace';         // trace | hint | memory
let strokes = [];           // {color, size, erase, pts:[[x,y]...]}
let liveStroke = null;
let brushColor = '#3D3D3D';
let brushSize = 8;
let eraser = false;
let peeking = false;

const guideCanvas = document.getElementById('guideCanvas');
const inkCanvas = document.getElementById('inkCanvas');
const gctx = guideCanvas.getContext('2d');
const ictx = inkCanvas.getContext('2d');

function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  cv.width = CANVAS_SIZE * dpr;
  cv.height = CANVAS_SIZE * dpr;
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}
setupCanvas(guideCanvas);
setupCanvas(inkCanvas);

/* ============================================================
   LESSON FLOW
   ============================================================ */
function startLesson(L){
  currentLesson = L;
  stepIndex = 0;
  strokes = [];
  document.getElementById('drawTitle').textContent = `${L.emoji} ${L.name}`;
  document.getElementById('peekBtn').style.display = L.free ? 'none' : 'flex';
  document.getElementById('modeRow').style.display = L.free ? 'none' : 'flex';
  show('draw');
  render();
}
function restartLesson(){ if(currentLesson) startLesson(currentLesson); }

function prevStep(){ if(stepIndex>0){ stepIndex--; render(); } }
function nextStep(){
  if(stepIndex < currentLesson.steps.length-1){
    stepIndex++;
    ding(660);
    render();
  } else {
    finishLesson();
  }
}

function render(){
  const L = currentLesson;
  document.getElementById('tipBox').textContent = L.steps[stepIndex].tip;
  // progress dots
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  L.steps.forEach((_,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i<stepIndex?' done':i===stepIndex?' now':'');
    prog.appendChild(d);
  });
  document.getElementById('backBtn').disabled = stepIndex===0;
  document.getElementById('nextBtn').textContent =
    (stepIndex === L.steps.length-1) ? (L.free ? '💾 Save' : '⭐ Finish!') : 'Next ➡';
  drawGuide();
  drawInk();
}

/* ---------- guide layer ---------- */
function drawGuide(){
  gctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
  const L = currentLesson;
  if(L.free) return;
  // earlier steps: soft grey solid
  gctx.setLineDash([]);
  gctx.lineWidth = 5;
  gctx.lineCap = 'round';
  gctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--guide-done').trim() || '#E3D7D1';
  for(let i=0;i<stepIndex;i++)
    L.steps[i].paths.forEach(p=>gctx.stroke(new Path2D(p)));
  // current step: dashed pink, opacity by mode
  let alpha = mode==='trace' ? 0.95 : mode==='hint' ? 0.35 : 0;
  if(peeking) alpha = 0.95;
  if(alpha>0){
    gctx.save();
    gctx.globalAlpha = alpha;
    gctx.strokeStyle = '#FF7BAC';
    gctx.lineWidth = 5;
    gctx.setLineDash([10,8]);
    L.steps[stepIndex].paths.forEach(p=>gctx.stroke(new Path2D(p)));
    gctx.restore();
  }
}

/* ---------- ink layer ---------- */
function drawInk(){
  ictx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
  const all = liveStroke ? strokes.concat([liveStroke]) : strokes;
  for(const s of all){
    ictx.save();
    ictx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ictx.strokeStyle = s.color;
    ictx.lineWidth = s.size;
    ictx.lineCap = 'round';
    ictx.lineJoin = 'round';
    ictx.beginPath();
    const pts = s.pts;
    if(pts.length === 1){
      ictx.arc(pts[0][0], pts[0][1], s.size/2, 0, Math.PI*2);
      ictx.fillStyle = s.color;
      ictx.fill();
    } else {
      ictx.moveTo(pts[0][0], pts[0][1]);
      for(let i=1;i<pts.length;i++) ictx.lineTo(pts[i][0], pts[i][1]);
      ictx.stroke();
    }
    ictx.restore();
  }
}

/* ---------- pointer input ---------- */
function canvasPos(e){
  const r = inkCanvas.getBoundingClientRect();
  return [ (e.clientX - r.left) / r.width * CANVAS_SIZE,
           (e.clientY - r.top) / r.height * CANVAS_SIZE ];
}
inkCanvas.addEventListener('pointerdown', e=>{
  e.preventDefault();
  inkCanvas.setPointerCapture(e.pointerId);
  liveStroke = { color:brushColor, size:brushSize*(eraser?2.2:1), erase:eraser, pts:[canvasPos(e)] };
  drawInk();
});
inkCanvas.addEventListener('pointermove', e=>{
  if(!liveStroke) return;
  e.preventDefault();
  liveStroke.pts.push(canvasPos(e));
  drawInk();
});
function endStroke(e){
  if(!liveStroke) return;
  strokes.push(liveStroke);
  liveStroke = null;
  drawInk();
}
inkCanvas.addEventListener('pointerup', endStroke);
inkCanvas.addEventListener('pointercancel', endStroke);

function undo(){ strokes.pop(); drawInk(); }
function clearInk(){ strokes = []; drawInk(); }

/* ---------- peek (hold) ---------- */
const peekBtn = document.getElementById('peekBtn');
['pointerdown'].forEach(ev=>peekBtn.addEventListener(ev, e=>{ e.preventDefault(); peeking = true; drawGuide(); }));
['pointerup','pointerleave','pointercancel'].forEach(ev=>peekBtn.addEventListener(ev, ()=>{ peeking = false; drawGuide(); }));

/* ---------- toolbar ---------- */
const colorBar = document.getElementById('colorBar');
COLORS.forEach(c=>{

    document.getElementById('eraserBtn').classList.remove('selected');

    b.classList.add('selected');

});

    brushSize = +b.dataset.size;
    document.querySelectorAll('.brush-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');

document.getElementById('eraserBtn').onclick = function(){
  eraser = !eraser;
  this.classList.toggle('selected', eraser);
};
document.querySelectorAll('.mode-chip').forEach(b=>{
  b.onclick = ()=>{
    mode = b.dataset.mode;
    document.querySelectorAll('.mode-chip').forEach(x=>x.classList.remove('selected'));

});

/* ============================================================
   FINISH + GALLERY
   ============================================================ */
const GKEY = 'dwm_gallery_v1';
function loadGallery(){ try{ return JSON.parse(localStorage.getItem(GKEY)) || []; }catch(e){ return []; } }
function saveGallery(g){ try{ localStorage.setItem(GKEY, JSON.stringify(g)); }catch(e){ /* storage full — drop oldest and retry */ g.shift(); try{ localStorage.setItem(GKEY, JSON.stringify(g)); }catch(e2){} } }

function snapshot(){
  const out = document.createElement('canvas');
  out.width = 400; out.height = 400;
  const c = out.getContext('2d');
  c.fillStyle = '#ffffff';
  c.fillRect(0,0,400,400);
  c.drawImage(inkCanvas, 0,0, 400,400);
  return out.toDataURL('image/png');
}

function finishLesson(){
  const url = snapshot();
  const g = loadGallery();
  g.push({ id:Date.now(), name:currentLesson.name, emoji:currentLesson.emoji, url });
  while(g.length > 40) g.shift();
  saveGallery(g);
  document.getElementById('partyImg').src = url;
  document.getElementById('partyTitle').textContent =
    currentLesson.free ? 'Beautiful! 🎉' : `Your ${currentLesson.name} is done! 🎉`;
  document.getElementById('party').classList.add('show');
  confettiBurst();
  ding(880); setTimeout(()=>ding(1100),150); setTimeout(()=>ding(1320),300);
}
function closeParty(){ document.getElementById('party').classList.remove('show'); }

function openGallery(){
  const g = loadGallery();
  const wrap = document.getElementById('galGrid');
  wrap.innerHTML = '';
  document.getElementById('galEmpty').style.display = g.length ? 'none' : 'block';
  [...g].reverse().forEach(item=>{
    const d = document.createElement('div');
    d.className = 'gal-item';
    d.innerHTML = `<img src="${item.url}" alt="${item.name}"><div class="cap">${item.emoji} ${item.name}</div><button class="del" aria-label="Delete">❌</button>`;
    d.querySelector('.del').onclick = ()=>{
      if(!confirm('Delete this drawing?')) return;
      saveGallery(loadGallery().filter(x=>x.id!==item.id));
      openGallery();
    };
    wrap.appendChild(d);
  });
  show('gallery');
}

/* ============================================================
   FUN: confetti + sounds
   ============================================================ */
function confettiBurst(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const glyphs = ['🎉','⭐','💖','🌸','✨','🎈'];
  for(let i=0;i<24;i++){
    const s = document.createElement('div');
    s.className = 'confetti';
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    s.style.animationDelay = (Math.random()*0.5) + 's';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 4200);
  }
}
let audioCtx = null;
function ding(freq){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const gnode = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    gnode.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gnode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    o.connect(gnode); gnode.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  }catch(e){}
}
