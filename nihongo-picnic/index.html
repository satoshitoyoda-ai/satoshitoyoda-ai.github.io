<!DOCTYPE html>

<title>Nihongo Picnic</title>
<style>
/* Indigo (藍) and yamabuki (山吹) on a cool paper ground. Quiet surfaces, one strong colour per player. */
:root{
  --ground:#F2F4F9; --surface:#FFFFFF; --tint:#F6F7FB; --ink:#12162B; --soft:#676D8C; --line:#E2E6F0;
  --primary:#2B3A8C; --primary-soft:#E6E9F8; --on-primary:#FFFFFF;
  --leaf:#1E8E78; --leaf-soft:#DDF2EC;
  --sun:#E0A21F; --sun-soft:#FBF1D9; --sun-ink:#7A5600;
  --good:#1C9A68; --good-soft:#DFF4EA; --bad:#D24B62; --bad-soft:#FBE4E8;
  --shadow:0 1px 2px rgba(18,22,43,.05),0 10px 28px -14px rgba(18,22,43,.22);
  --ui:"Manrope","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Manrope",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1020; --surface:#171B2E; --tint:#1E2338; --ink:#EEF0FA; --soft:#9CA2C2; --line:#2A3050;
  --primary:#8E9CFF; --primary-soft:#232A52; --on-primary:#0D1020;
  --leaf:#4CC7AE; --leaf-soft:#16362F; --sun:#F2BC45; --sun-soft:#3A2F12; --sun-ink:#F6D58A;
  --good:#44C792; --good-soft:#143427; --bad:#F0788C; --bad-soft:#3D1A22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#0D1020; --surface:#171B2E; --tint:#1E2338; --ink:#EEF0FA; --soft:#9CA2C2; --line:#2A3050;
  --primary:#8E9CFF; --primary-soft:#232A52; --on-primary:#0D1020;
  --leaf:#4CC7AE; --leaf-soft:#16362F; --sun:#F2BC45; --sun-soft:#3A2F12; --sun-ink:#F6D58A;
  --good:#44C792; --good-soft:#143427; --bad:#F0788C; --bad-soft:#3D1A22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.7);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:18px 32px;min-height:100%;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.jp{font-family:var(--jp)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.num{font-variant-numeric:tabular-nums;font-weight:800}

/* bars */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;display:inline-flex;gap:8px;align-items:baseline}
.pill span{color:var(--soft);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.ghost:active,.btn:active,.card-btn:active,.opt:active{transform:scale(.98)}
.combo{color:var(--sun-ink);background:var(--sun-soft);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}

/* home */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.hero h1{font-size:clamp(34px,8vw,48px);font-weight:800}
.hero h1 .jp{font-weight:900;color:var(--primary)}
.hero p{color:var(--soft);font-weight:600;max-width:40ch}
.stack{display:flex;flex-direction:column;gap:12px}
.card-btn{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 16px;align-items:center;text-align:left;transition:transform .08s}
.fam{cursor:default}.fam:active{transform:none}
.lvrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lv{flex:1 1 42px;min-width:42px;border:1px solid var(--line);background:var(--tint);border-radius:14px;padding:8px 4px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .08s}
.lv b{font-size:19px;font-weight:800;line-height:1.1}
.lv .stars{font-size:11px;letter-spacing:0}
.lv:active{transform:scale(.96)}
.lv[disabled]{opacity:.5;cursor:default}
.card-btn[disabled]{opacity:.55;cursor:default;box-shadow:none}
.ic{font-weight:800}
.avatar{grid-row:span 2;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:32px;line-height:1}
.avatar.big{background:var(--primary-soft)} .avatar.little{background:var(--leaf-soft)}
.card-btn .nm{font-size:20px;font-weight:800;letter-spacing:-.01em}
.card-btn .meta{color:var(--soft);font-weight:600;font-size:14px;grid-column:2}
.card-btn .side{grid-row:span 2;grid-column:3;text-align:right}
.card-btn .side .num{font-size:22px;display:block;line-height:1.1}
.foot{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.textlink{font-weight:700;color:var(--primary);padding:6px 0;text-align:left}
.sync{font-size:13px;font-weight:600;color:var(--soft);display:inline-flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--soft)}
.sync.on i{background:var(--good)}

.weeks{display:flex;gap:8px}
.wk{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:0;transition:transform .08s}
.wk small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.wk b{font-size:17px;font-weight:900}
.wk.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.wk.on small{color:var(--on-primary);opacity:.8}
.wk:active{transform:scale(.98)}
/* hub */
.hub h2{font-size:28px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tile{grid-template-columns:auto 1fr auto}
.ic{grid-row:span 2;width:52px;height:52px;border-radius:16px;background:var(--tint);display:grid;place-items:center;font-size:26px;line-height:1}
.tile .t{font-family:var(--jp);font-weight:900;font-size:18px}
.tile .d{color:var(--soft);font-size:13px;font-weight:600;grid-column:2}
.tile .side small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-weight:700}
.stars{color:var(--sun);letter-spacing:1px;font-size:13px}
.mission{background:var(--sun-soft);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.mission .eyebrow{color:var(--sun-ink)}
.mission h3{font-family:var(--jp);font-weight:900;font-size:20px}
.mission ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.mission .ghost{align-self:flex-start;background:var(--ink);color:var(--ground);border-color:var(--ink)}
.mission .ghost[disabled]{background:var(--good);border-color:var(--good);color:#fff;cursor:default}

/* game */
.track{display:flex;gap:4px;flex:1;min-width:120px}
.track i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track i.ok{background:var(--good)} .track i.meh{background:var(--sun)} .track i.now{background:var(--primary)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.speaker{width:96px;height:96px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 0 0 10px var(--primary-soft)}
.speaker svg{width:40px;height:40px}
.speaker.playing{animation:halo 1s ease-in-out infinite alternate}
.speaker.nudge{animation:halo .6s ease-in-out infinite alternate;background:var(--sun);color:#12162B}
@keyframes halo{to{box-shadow:0 0 0 18px var(--primary-soft)}}
.hintline{font-weight:600;color:var(--soft);min-height:1.5em;font-size:15px}
.reveal{font-family:var(--jp);font-size:24px;font-weight:900}
.reveal small{display:block;font-family:var(--ui);font-size:14px;color:var(--soft);font-weight:600;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
.opt{background:var(--tint);border:1.5px solid var(--line);border-radius:22px;min-height:120px;font-size:clamp(40px,11vw,60px);line-height:1.1;padding:8px;display:grid;place-items:center;word-break:break-all;transition:transform .08s,background .15s,border-color .15s}
.opt.multi{font-size:clamp(28px,8vw,44px)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:transparent;opacity:.45;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opts.six{grid-template-columns:repeat(3,1fr)}
.opts.six .opt{min-height:96px;font-size:clamp(32px,9vw,52px)}
.plus{font-size:.5em;color:var(--soft);padding:0 6px}
.opts.text{grid-template-columns:1fr}
.opt.txt{font-family:var(--jp);font-weight:900;font-size:clamp(17px,4.6vw,22px);line-height:1.45;min-height:76px;padding:10px 14px;word-break:keep-all}
.basket{width:100%;min-height:96px;border:2px dashed var(--line);border-radius:22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:10px;font-size:clamp(30px,8vw,44px);line-height:1.1;word-break:break-all}
.basket .empty{opacity:.4}
.basket.right{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.basket.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.shelfitem{background:var(--tint);border:1.5px solid var(--line);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.shelfitem span{font-size:clamp(34px,9vw,48px);line-height:1.1} .shelfitem small{font-size:12px;font-weight:800;color:var(--soft)}
.shelfitem:active{transform:scale(.94)}
.clue[disabled]{opacity:.55} .speaker[disabled]{opacity:.35}
.clue em{font-style:normal;font-weight:800;font-family:var(--jp);color:var(--soft)}
.micbtn{width:104px;height:104px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 0 0 10px var(--primary-soft);transition:transform .08s}
.micbtn svg{width:44px;height:44px}
.micbtn:active{transform:scale(.96)}
.micbtn.live{background:var(--bad);box-shadow:0 0 0 10px var(--bad-soft);animation:livemic .7s ease-in-out infinite alternate}
@keyframes livemic{to{box-shadow:0 0 0 20px var(--bad-soft)}}
.heard{font-weight:700;color:var(--soft);font-size:15px}
.passmsg{color:var(--good);font-weight:900;font-size:24px}
.avatar.team{background:var(--sun-soft)}
.role{align-self:stretch;text-align:left;font-weight:800;font-size:15px;border-radius:12px;padding:8px 14px}
.role.big{background:var(--primary-soft);color:var(--primary)} .role.little{background:var(--leaf-soft);color:var(--leaf)}
.readbig{font-size:clamp(34px,9vw,56px);font-weight:900;line-height:1.3}
.mailcard{background:var(--sun-soft);border-color:transparent} .mailcard .ic{background:var(--surface)}
.wishcard .ic{background:var(--primary-soft)}
.mailwait{text-align:center}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transition:transform .08s}
.choice .e{font-size:36px;line-height:1.1} .choice b{font-family:var(--jp);font-size:15px;font-weight:900} .choice small{font-size:11px;color:var(--soft);font-weight:600}
.choice.big{padding:18px 8px} .choice.big .e{font-size:48px}
.choice.on{border-color:var(--primary);background:var(--primary-soft)} .choice:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default}
.pattern{font-size:22px;font-weight:900;color:var(--primary);background:var(--primary-soft);border-radius:12px;padding:6px 16px}
.cue{font-size:22px;font-weight:800;letter-spacing:-.01em}
.clues{display:flex;flex-direction:column;gap:8px;width:100%}
.clue{display:flex;align-items:center;gap:14px;background:var(--tint);border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;width:100%}
.clue svg{width:20px;height:20px;color:var(--primary);flex:none}
.clue b{font-family:var(--jp);font-weight:900;font-size:20px;display:block}
.clue small{display:block;font-size:13px;color:var(--soft);font-weight:600}
.pic{font-size:clamp(80px,22vw,120px);line-height:1}
.ring{width:88px;height:88px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ringlabel{font-weight:800;color:var(--primary)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);border-radius:999px;padding:13px 24px;font-weight:800;font-size:16px;background:var(--surface);transition:transform .08s}
.btn.main{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.leaf{background:var(--leaf);color:#fff;border-color:var(--leaf)}

/* results */
.bigscore{font-size:clamp(64px,18vw,104px);line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bigstars{font-size:34px;letter-spacing:6px;color:var(--sun)}
.newbest{background:var(--sun-soft);color:var(--sun-ink);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:6px 16px}
.sub{font-weight:600;color:var(--soft);font-size:14px}

/* grown-ups */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.doc h2{font-size:24px;font-weight:800} .doc h3{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:10px}
.doc p,.doc li{max-width:65ch}
.doc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
td.j{font-family:var(--jp);font-weight:900;font-size:16px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--soft)}
.field input{font:inherit;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--tint);color:var(--ink);max-width:240px}
.note{background:var(--primary-soft);border-radius:14px;padding:14px 16px;font-weight:600;font-size:14px}
.warn{background:var(--bad-soft);border-radius:14px;padding:14px 16px;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
/*PACKS-START*/
/* ---------- weekly content packs. Everything a week needs lives in its pack; the games are generic. ---------- */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
// {x}=Japanese word · {e}/{E}=English word · {g}/{G}=generic English ("apples", "Grandma", "the dog") · {o}="an apple"
const ft=(t,w,x)=>t.replace('{x}',x).replace('{e}',w.en).replace('{E}',cap(w.en)).replace('{g}',w.gen).replace('{G}',cap(w.gen)).replace('{o}',w.one).replace('{m}',w.my||'').replace('{t}',w.ths||'');
const CUE1='How do you say this in Japanese?';
const COUNTERS={
 tsu:[{n:1,jp:'ひとつ',tts:'一つ',word:'one'},{n:2,jp:'ふたつ',tts:'二つ',word:'two'},{n:3,jp:'みっつ',tts:'三つ',word:'three'}],
 nin:[{n:1,jp:'ひとり',tts:'一人',word:'one'},{n:2,jp:'ふたり',tts:'二人',word:'two'},{n:3,jp:'さんにん',tts:'三人',word:'three'}],
 hiki:[{n:1,jp:'いっぴき',tts:'一匹',word:'one'},{n:2,jp:'にひき',tts:'二匹',word:'two'},{n:3,jp:'さんびき',tts:'三匹',word:'three'}],
 wa:[{n:1,jp:'いちわ',tts:'一羽',word:'one'},{n:2,jp:'にわ',tts:'二羽',word:'two'},{n:3,jp:'さんわ',tts:'三羽',word:'three'}]
};
const PACKS={
w1:{id:'w1',week:1,jp:'たべもの',en:'Food',
 words:[
  {id:'ringo',jp:'りんご',en:'apple',one:'an apple',gen:'apples',pl:'apples',cnt:'tsu',pic:'🍎'},{id:'banana',jp:'バナナ',en:'banana',one:'a banana',gen:'bananas',pl:'bananas',cnt:'tsu',pic:'🍌'},
  {id:'ichigo',jp:'いちご',en:'strawberry',one:'a strawberry',gen:'strawberries',pl:'strawberries',cnt:'tsu',pic:'🍓'},{id:'mikan',jp:'みかん',en:'mandarin orange',one:'a mandarin orange',gen:'mandarin oranges',pl:'mandarin oranges',cnt:'tsu',pic:'🍊'},
  {id:'budou',jp:'ぶどう',en:'grapes',one:'grapes',gen:'grapes',cnt:'tsu',pic:'🍇'},{id:'suika',jp:'すいか',en:'watermelon',one:'a watermelon',gen:'watermelon',pl:'watermelons',cnt:'tsu',pic:'🍉'},
  {id:'mizu',jp:'みず',tts:'水',en:'water',one:'water',gen:'water',cnt:'tsu',pic:'💧'},{id:'gyunyu',jp:'ぎゅうにゅう',tts:'牛乳',en:'milk',one:'milk',gen:'milk',cnt:'tsu',pic:'🥛'},
  {id:'pan',jp:'パン',en:'bread',one:'bread',gen:'bread',cnt:'tsu',pic:'🍞'},{id:'onigiri',jp:'おにぎり',en:'rice ball',one:'a rice ball',gen:'rice balls',pl:'rice balls',cnt:'tsu',pic:'🍙'},
  {id:'tamago',jp:'たまご',tts:'卵',en:'egg',one:'an egg',gen:'eggs',pl:'eggs',cnt:'tsu',pic:'🥚'},{id:'keeki',jp:'ケーキ',en:'cake',one:'cake',gen:'cake',pl:'cakes',cnt:'tsu',pic:'🍰'}],
 frames:[
  {id:'kudasai',jp:'{x}を ください。',tts:'{x}をください。',en:'{E}, please.',cue:'Ask for the {e}, please.'},
  {id:'doko',jp:'{x}は どこ？',tts:'{x}はどこ？',en:'Where is the {e}?',cue:'Ask: where is the {e}?'},
  {id:'suki',jp:'{x}が すき！',tts:'{x}が好き！',en:'I like {e}!',cue:'Say: I like {e}!'},
  {id:'hoshii',jp:'{x}が ほしい。',tts:'{x}が欲しい。',en:'I want {e}.',cue:'Say: I want the {e}.'}],
 frames3:[
  {id:'neg',jp:'{x}が すきじゃない。',tts:'{x}が好きじゃない。',en:"I don't like {g}.",cue:"Say: I don't like {g}."},
  {id:'q',jp:'{x}が すき？',tts:'{x}が好き？',en:'Do you like {g}?',cue:'Ask: do you like {g}?'},
  {id:'desu',jp:'これは {x} です。',tts:'これは{x}です。',en:'This is {o}.',cue:'Say: this is {o}.'}],
 fixed:[
  {id:'itadaki',jp:'いただきます！',tts:'いただきます！',en:'(before eating)',cue:'What do we say before we eat?',pic:'🙏'},
  {id:'gochiso',jp:'ごちそうさま！',tts:'ごちそうさま！',en:'(after eating)',cue:'What do we say when we finish eating?',pic:'😋'},
  {id:'oishii',jp:'おいしい！',tts:'美味しい！',en:'Yummy!',cue:'Say: yummy!',pic:'🤤'},
  {id:'motto',jp:'もっと ください。',tts:'もっとください。',en:'More, please.',cue:'Ask for more, please.',pic:'🍽️',late:true},

/* ---------- round setup: every round draws fresh random questions in a shuffled order ---------- */
function truth(id,c){const f=PK.facts[id];const base=PK.neg[c]||c;if(f.maybe.includes(base))return null;const v=f.is.includes(base);return PK.neg[c]?!v:v}
function makePuzzle(level,used){
  const CATS=PK.cats,NEG=PK.neg,K=level>=4?5:level===1?2:3,MAXC=level>=4?4:3; // levels 4-6: six pictures, up to four clues
  for(let tries=0;tries<400;tries++){
    const t=rnd(WORDS).id;if(used.includes(t)&&tries<200)continue;
    const opts=[t,...distract(t,K).map(w=>w.id)];
    const ok=c=>opts.every(o=>truth(o,c)!==null);
    const cat=CATS.find(c=>PK.facts[t].is.includes(c));
    let first=cat;if(level>1&&Math.random()<.35){const negs=Object.keys(NEG).filter(c=>CATS.includes(NEG[c])&&truth(t,c)===true&&ok(c));if(negs.length)first=rnd(negs)}
    if(!ok(first))continue;
    const clues=[first];let left=opts.filter(o=>o!==t&&truth(o,first)===true);
    const cands=shuffle(Object.keys(PK.cl).filter(c=>c!==first&&!CATS.includes(c)&&!CATS.includes(NEG[c])&&truth(t,c)===true&&ok(c)&&(level>1||!NEG[c])));
    for(const c of cands){if(clues.length>=MAXC||(left.length===0&&clues.length>=2))break;
      const nl=left.filter(o=>truth(o,c)===true);if(nl.length<left.length||left.length===0){clues.push(c);left=nl}}
    if(left.length===0&&clues.length>=2)return {t,opts,clues};
  }
  if(level>=4)return makePuzzle(2,used);
  const t=WORDS[0].id;return {t,opts:[t,WORDS[6].id,WORDS[7].id],clues:[PK.cats.find(c=>PK.facts[t].is.includes(c)),PK.facts[t].is[1]]};
}
function play(game){

  const wordQ=(w,k)=>({type:'pick',say:w.tts||w.jp,show:w.jp,en:cap(w.en),word:w.id,opts:pics(w,k)});
  const sentQ=(w,f,k)=>({type:'pick',six:k===5,say:f.tts(w),show:f.jp(w),en:f.en(w),word:w.id,opts:pics(w,k)});
  const easy=SENT.filter(s=>!s.hard),countable=WORDS.filter(w=>w.cnt);
  const copyW=w=>({type:'copy',say:w.tts||w.jp,show:w.jp,en:cap(w.en),pic:w.pic});
  const copyF=f=>({type:'copy',say:f.tts,show:f.jp,en:f.en,pic:f.pic});

      <p class="sub">${isBest?`Previous best ${prev||'—'}`:`Your best ${prev}`} · Perfect game ${maxScore(g.n)}</p>
      <div class="row"><button class="btn main" data-act="play" data-game="${G.game}">Play again</button>${nextLv?'<button class="btn" data-act="play" data-game="'+nextLv+'">Next level</button>':''}<button class="btn" data-act="hub" data-who="big">All games</button></div></div>`;
  }else{
    const st=G.marks.filter(Boolean).length;P.stars+=st;P.best[key]=(P.best[key]||0)+1;save();push();
    app.innerHTML=`<div class="stage"><div class="pic">🎉</div><h2 class="jp">できた！</h2><div class="bigstars">${'★'.repeat(Math.min(st,6))}</div>
      <div class="row"><button class="btn leaf jp" data-act="play" data-game="${G.game}">もういっかい</button><button class="btn" data-act="hub" data-who="little">All games</button></div></div>`;
  }
  G=null;
}

/* ---------- grown-ups ---------- */
function lines(){
  const w=WORDS[0],cw=WORDS.find(x=>x.cnt),out=[];WORDS.forEach(x=>out.push([x.jp,cap(x.en)]));
  FIXED.forEach(f=>out.push([f.jp,f.en]));
  PK.frames.concat(PK.frames3).forEach(f=>{const x=WORDS.find(v=>(!f.kind||f.kind===v.kind)&&!(f.skip||[]).includes(v.id))||w;out.push([ft(f.jp,x,x.jp),ft(f.en,x,'')+' — record once per word it fits']);});
  COUNTERS[cw.cnt].forEach(c=>out.push([PK.countSay(cw,c).show,PK.countSay(cw,c).en+' — once per countable word']));
  Object.values(PK.cl).forEach(c=>out.push([c[0],c[2]]));out.push([ORD2[0].show,ORD2[0].en+' — 30 two-group sentences (level 3)']);
  return out;
}
function grown(){
  screen='grown';
  const trouble=k=>Object.entries(S.players[k].miss).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>`${ALLW[id]?ALLW[id].jp:id} (${n})`).join('、')||'None yet';
  app.innerHTML=`<div class="bar"><button class="ghost" data-act="home">← Players</button></div>
  <div class="doc"><h2>For grown-ups</h2>
   <p>The app teaches each week's phrases by ear. They stick when the kids hear the same phrases from you and Grandma. About 10 minutes of play, then use the phrases in real life.</p>
   ${weekSwitch()}
   <h3>Use these at home — week ${PK.week}, <span class="jp">${PK.jp}</span></h3>
   <div class="scroll"><table><thead><tr><th>Say</th><th>Meaning</th><th>When</th></tr></thead><tbody>${PK.home.map(r=>`<tr><td class="j">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
   <p class="note">If they answer in English, don't switch. Guess in Japanese or say 「にほんごで？」 and wait. Praise the try, not the accent.</p>
   <h3>What the levels are</h3>
   <ul>${Object.keys(ALLF).map(f=>`<li><b class="jp">${famTitle(f).jp}</b> — ${famLv(f).map((t,i)=>(i+1)+'. '+t).join(' · ')}</li>`).join('')}</ul>
   <p class="sub">Levels measure how hard the task is, not a school grade. Every week so far is first-months beginner Japanese (below JLPT N5): words a Japanese toddler knows, in sentence patterns a beginner course teaches early.</p>
   <h3>Progress</h3>
   <ul><li>${esc(S.players.big.name)}: ${S.players.big.stars} stars · words to repeat at home: <span class="jp">${esc(trouble('big'))}</span></li>
       <li>${esc(S.players.little.name)}: ${S.players.little.stars} stars · words to repeat at home: <span class="jp">${esc(trouble('little'))}</span></li>
       <li>Family missions done: ${Object.keys(S.missions).length}</li></ul>
   <p class="sub">${syncOn?'Scores sync across every device signed in to this page.':'Scores are saved on this device.'}</p>
   <h3>Her pick for next week</h3>
   <p>${S.wish.theme&&THEMES[S.wish.theme]?'<b class="jp">'+THEMES[S.wish.theme].jp+'</b> ('+THEMES[S.wish.theme].en+') — <span class="jp">'+esc((S.wish.words||[]).join('、'))+'</span>':'She has not chosen yet. The 🗳️ card is on her games screen.'}</p>
   <h3>Secret messages from Grandma or Dad</h3>
   <p>Record a short message in Japanese, such as 「よく できたね！ おばあちゃんは うれしいよ」. It stays sealed and opens as a surprise once the kids earn a few more stars. Record several at once and they open one after another.</p>
   <div class="row" style="justify-content:flex-start"><label class="field" for="msg-from">From<input id="msg-from" value="おばあちゃん" maxlength="16"></label><label class="field" for="msg-text" style="flex:1;min-width:220px">Written message (optional)<input id="msg-text" maxlength="80" style="max-width:none"></label></div>
   <div class="row" style="justify-content:flex-start"><button class="btn" data-act="recstart">● Record</button><button class="btn" data-act="recstop">■ Stop</button><button class="btn" data-act="recplay">Play it back</button><button class="btn main" data-act="msgsave">Save message</button></div>
   <p class="sub" id="recmsg">Up to about 10 seconds. If this device will not record here, a written message still works.</p>
   ${MSGS.length?'<ul>'+MSGS.map(m=>'<li>'+esc(m.from)+(m.audio?' · voice':'')+(m.text?' · 「<span class="jp">'+esc(m.text)+'</span>」':'')+' — '+(S.opened[m.id]?'opened':msgReady(m)?'ready to open':'opens in '+(m.need-totalStars())+' more stars')+' <button class="textlink" data-act="msgdel" data-id="'+m.id+'">Delete</button></li>').join('')+'</ul>':''}
   <h3>Microphone check in いってみよう</h3>
   <p>${!SR?'This browser has no speech recognition, so いってみよう uses the "I said it" button.':micBroken?'The microphone does not work on this device in this browser (code: '+esc(micBroken)+'), so いってみよう uses the "I said it" and "Not yet" buttons: she says it, you judge. Tap Test to check again after an update.':'She taps the microphone and says it. The app checks whether a listener would have understood her. It is lenient, and a grown-up can overrule a miss.'}</p>
   <p class="sub">Speech recognition is off on this site, so いってみよう uses the "I said it" buttons. Recorded messages stay on this device.</p>
   <div class="row" style="justify-content:flex-start"><button class="btn ${micPref?'main':''}" data-act="micpref" data-v="on">On</button><button class="btn ${micPref?'':'main'}" data-act="micpref" data-v="off">Off</button><button class="btn" data-act="mictest">Test the microphone</button></div>
   <p class="sub" id="mictest">The 4-year-old's games never use the microphone.</p>
   <h3>Japanese voice speed</h3>
   <div class="row" style="justify-content:flex-start">${Object.keys(SPEEDS).map(k=>`<button class="btn ${speed===k?'main':''}" data-act="speed" data-v="${k}">${cap(k)}</button>`).join('')}<button class="btn" data-act="testvoice">Play a sample</button></div>
   <p class="sub">This setting is kept per device.</p>
   <h3>Names</h3>
   <div class="row" style="justify-content:flex-start"><label class="field" for="nm-big">Older child<input id="nm-big" value="${esc(S.players.big.name)}" maxlength="16"></label>
   <label class="field" for="nm-little">Younger child<input id="nm-little" value="${esc(S.players.little.name)}" maxlength="16"></label></div>
   <div class="row" style="justify-content:flex-start"><button class="btn main" data-act="names">Save names</button><button class="btn" data-act="reset">Reset all scores</button></div>
   <h3>Recording list for Dad — week ${PK.week}</h3>
   <p>The app currently uses an AI voice. To replace it with your own, record each line once in the Voice Memos app, slowly and clearly, one line per clip.</p>
   <div class="scroll"><table><thead><tr><th>Line</th><th>Meaning</th></tr></thead><tbody>${lines().map(l=>`<tr><td class="j">${esc(l[0])}</td><td>${esc(l[1])}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

/* ---------- events ---------- */
const sample=()=>speak(PK.countSay(WORDS.find(w=>w.cnt),COUNTERS[WORDS.find(w=>w.cnt).cnt][1]).tts);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='home')home();
  else if(a==='hub'){who=b.dataset.who;hub()}
  else if(a==='grown')grown();
  else if(a==='week'){setWeek(b.dataset.v);if(screen==='grown')grown();else home()}
  else if(a==='play')play(b.dataset.game);
  else if(a==='quit'){hush();push();if(G&&GAMES[G.game].fam==='team')teamHub();else hub()}
  else if(a==='replay'){const q=G&&G.qs[G.i];if(q){if(q.once){if(G.replayed)return;G.replayed=true;b.disabled=true}sayQ(q)}}
  else if(a==='bput')basketPut(b.dataset.id);
  else if(a==='bclear'){if(G&&!G.lock){G.basket={};basketDraw()}}
  else if(a==='bdone')basketCheck();
  else if(a==='ans')answer(+b.dataset.k,b);
  else if(a==='clue'){const q=G.qs[G.i];if(!q.silent)speak(q.clues[+b.dataset.k][1])}
  else if(a==='hint'){G.hint=true;showClues();b.hidden=true}
  else if(a==='again'){sayQ(G.qs[G.i])}
  else if(a==='said'){tone('ok');if(who==='big'){if(G.hint){G.combo=0;G.score+=60}else{G.combo++;G.score+=100+Math.min(50,(G.combo-1)*10)}}G.marks[G.i]=G.hint?'meh':'ok';next()}
  else if(a==='mic'){listen()}
  else if(a==='giveup'){giveUp()}
  else if(a==='micnext'){G.combo=0;G.score+=20;G.marks[G.i]='meh';next()}
  else if(a==='micoverride'){G.score+=70;G.marks[G.i]='meh';tone('ok');next()}
  else if(a==='micpref'){micPref=b.dataset.v==='on';try{localStorage.setItem('np-mic',micPref?'on':'off')}catch(x){}grown()}
  else if(a==='mictest'){micTest()}
  else if(a==='sayhint'){G.hint=true;const x=document.getElementById('hintbox');if(x){x.textContent=G.qs[G.i].show;x.hidden=false}b.hidden=true}
  else if(a==='skipwait'){if(G&&G.skipWait)G.skipWait()}
  else if(a==='notyet'){G.combo=0;G.score+=20;G.marks[G.i]='meh';next()}
  else if(a==='team')teamHub();
  else if(a==='teachhelp'){G.hint=true;speak(G.qs[G.i].say)}
  else if(a==='mail')mail();
  else if(a==='openmsg')openMsg(b.dataset.id);
  else if(a==='msgplay'){const m=MSGS.find(x=>x.id===b.dataset.id);if(m&&m.audio)playData(m.audio)}
  else if(a==='recstart')recStart();
  else if(a==='recstop'){if(mrec&&mrec.state==='recording')mrec.stop()}
  else if(a==='recplay'){if(draft)playData(draft)}
  else if(a==='msgsave')saveMsg();
  else if(a==='msgdel'){if(b.dataset.sure)delMsg(b.dataset.id);else{b.dataset.sure='1';b.textContent='Tap again to delete'}}
  else if(a==='wish')wish();
  else if(a==='wtheme'){if(wishDraft.theme!==b.dataset.v)wishDraft={theme:b.dataset.v,words:[]};wishWords()}
  else if(a==='wword'){const v=b.dataset.v,i=wishDraft.words.indexOf(v);if(i>=0)wishDraft.words.splice(i,1);else if(wishDraft.words.length<8)wishDraft.words.push(v);wishWords()}
  else if(a==='wsave'){S.wish={theme:wishDraft.theme,words:wishDraft.words.slice(),at:Date.now()};save();push();tone('win');hub()}
  else if(a==='mission'){S.missions[today()]=true;save();push();tone('win');hub()}
  else if(a==='speed'){speed=b.dataset.v;try{localStorage.setItem('np-speed',speed)}catch(x){}grown();sample()}
  else if(a==='testvoice'){sample()}
  else if(a==='names'){const x=document.getElementById('nm-big').value.trim(),y=document.getElementById('nm-little').value.trim();const t=Date.now();
    if(x&&x!==S.players.big.name){S.players.big.name=x;S.players.big.nameAt=t}if(y&&y!==S.players.little.name){S.players.little.name=y;S.players.little.nameAt=t}save();push();b.textContent='Saved'}
  else if(a==='reset'){if(b.dataset.sure){const o=S.players;S=fresh();S.resetAt=Date.now();for(const k of['big','little']){S.players[k].name=o[k].name;S.players[k].nameAt=o[k].nameAt}save();push();grown()}else{b.dataset.sure='1';b.textContent='Tap again to erase all scores'}}
});
home();
</script>
