<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toshi's Math Walk</title>
<style>
/* Layout: one centered column in a sunny park. Home (Toshi + today's clock) → Walk (trail, question card, keypad) → Grown-ups dashboard. Deliberately single (light) theme. */
:root{
  color-scheme: light;
  --sky:#DCEFF9; --sky-deep:#BFE0F2;
  --grass:#4A965A; --grass-soft:#D7ECCD;
  --paper:#FFFDF6; --ink:#1F2D3D; --muted:#5A6A7B; --line:#D6E1E8;
  --sun:#FFC83A; --sun-soft:#FFF1C4;
  --toshi:#B8763C; --toshi-dark:#7C4B23; --cream:#F4DCB8;
  --coral:#E8604F; --coral-soft:#FCE2DD;
  --ok:#2A9455; --ok-soft:#DCF2E4;
  --blue:#4A82D4; --pink:#EE88AE;
  --f-display:"Lexend","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-body:"Andika","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --r:20px;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 55%,var(--grass-soft) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
.card{background:var(--paper);border-radius:var(--r);box-shadow:0 2px 0 var(--line),0 8px 24px rgba(31,45,61,.06);padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);font-weight:700;font-size:16px;box-shadow:0 1px 0 var(--line)}
.linkbtn{padding:8px 12px;border-radius:12px;font-weight:700;font-size:16px;color:var(--muted)}
.linkbtn:hover{background:rgba(255,255,255,.6)}
.tab-nums{font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero h1{font-size:clamp(30px,6vw,46px);color:var(--toshi-dark)}
.hero p{margin:6px 0 0;color:var(--muted)}
.hero .toshi{width:clamp(120px,26vw,170px);height:auto}
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:132px;height:132px}
.ring .bg{fill:none;stroke:var(--sun-soft);stroke-width:12}
.ring .fg{fill:none;stroke:var(--sun);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .6s}
.ring.done .fg{stroke:var(--ok)}
.ring text{font-family:var(--f-display);fill:var(--ink)}
.ring .big{font-size:26px;font-weight:700}
.ring .small{font-size:12px;fill:var(--muted)}
.today h2{font-size:24px}
.today .sub{color:var(--muted);margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:20px;border-radius:var(--r);background:var(--grass);color:#fff;font-family:var(--f-display);font-weight:700;font-size:28px;box-shadow:0 6px 0 #357444;transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #357444}
.sect-label{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px 0}
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.topic{background:var(--paper);border-radius:16px;padding:14px 12px;text-align:left;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.topic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.topic .ico{font-size:26px;line-height:1}
.topic b{font-family:var(--f-display);font-size:18px;font-weight:700}
.lvl{display:flex;gap:3px}
.lvl i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--sun)}
.closet{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--paper);font-weight:700;font-size:16px;box-shadow:0 2px 0 var(--line)}
.chip.on{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun)}
.chip.locked{opacity:.45;cursor:default}
.footer{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--muted);font-size:14px}

/* Walk */
.bar{display:flex;align-items:center;gap:10px}
.homebtn{width:48px;height:48px;border-radius:14px;background:var(--paper);font-size:22px;box-shadow:0 2px 0 var(--line)}
.clock-mini{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.clock-mini .lbl{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.clock-mini .lbl span:last-child{color:var(--muted);font-weight:400}
.meter{height:12px;border-radius:999px;background:var(--paper);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .5s}
.meter.done i{background:var(--ok)}
.paused{color:var(--coral)}
.trail{background:var(--grass-soft);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.stop{display:flex;flex-direction:column;align-items:center;font-size:14px;font-weight:700;color:var(--grass);max-width:84px;text-align:center}
.stop .em{font-size:30px;line-height:1.1}
.path{position:relative;height:56px}
.paws{position:absolute;left:0;right:0;top:50%;display:flex;justify-content:space-between;transform:translateY(-50%)}
.paws i{width:12px;height:12px;border-radius:50%;background:rgba(74,150,90,.25)}
.paws i.on{background:var(--grass)}
.walker{position:absolute;top:-6px;width:56px;margin-left:-28px;transition:left .6s cubic-bezier(.3,1.4,.5,1)}
.walker .toshi{width:56px;height:auto}
.steps-left{font-size:16px;color:var(--muted);text-align:center;margin-top:-4px}
.qcard{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.qtopic{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:clamp(30px,7vw,48px);font-weight:700;font-variant-numeric:tabular-nums}
.qtext.words{font-family:var(--f-body);font-size:clamp(20px,4.2vw,26px);font-weight:700;line-height:1.45;max-width:34ch;text-align:left}
.qtext .hl{background:var(--sun-soft);border-radius:8px;padding:0 4px;box-shadow:0 0 0 2px var(--sun)}
.visual{max-width:100%;overflow-x:auto}
.ansbox{min-width:150px;padding:10px 20px;border-radius:16px;background:var(--sky);font-family:var(--f-display);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;min-height:72px;display:flex;align-items:center;justify-content:center;gap:4px}
.ansbox .ph{color:var(--sky-deep)}
.ansbox.shake{animation:shake .4s}
.ansbox.right{background:var(--ok-soft);color:var(--ok)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.pad button{height:64px;border-radius:16px;background:var(--paper);font-family:var(--f-display);font-size:30px;font-weight:700;box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),inset 0 0 0 2px var(--line)}
.pad .check{background:var(--grass);color:#fff;box-shadow:0 4px 0 #357444}
.pad .del{font-size:24px;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:420px}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices button{min-height:72px;border-radius:16px;background:var(--paper);font-family:var(--f-display);font-size:32px;font-weight:700;box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line);font-variant-numeric:tabular-nums}
.choices button:disabled{opacity:.35}
.choices button.right{background:var(--ok-soft);color:var(--ok);box-shadow:0 4px 0 var(--ok),inset 0 0 0 2px var(--ok)}
.fb{width:100%;border-radius:16px;padding:12px 16px;font-weight:700;font-size:19px}
.fb.ok{background:var(--ok-soft);color:var(--ok);font-family:var(--f-display);font-size:24px}
.fb.try{background:var(--sun-soft);color:var(--toshi-dark)}
.fb.no{background:var(--coral-soft);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:8px}
.fb.no .ans{font-family:var(--f-display);font-size:24px;color:var(--coral)}
.fb .lvlup{display:block;margin-top:4px;font-size:16px;color:var(--toshi-dark)}
.explain{font-weight:400;font-size:17px;display:flex;flex-direction:column;gap:6px}
.vert{font-family:var(--f-display);font-size:30px;font-weight:700;border-collapse:collapse;margin:2px 0;font-variant-numeric:tabular-nums}
.vert td{width:28px;text-align:center;padding:0 2px}
.vert .carry td{font-size:16px;color:var(--coral);height:18px}
.vert .sum td{border-top:3px solid var(--ink)}
.nextbtn{padding:14px 34px;border-radius:16px;background:var(--grass);color:#fff;font-family:var(--f-display);font-weight:700;font-size:24px;box-shadow:0 4px 0 #357444}
.toshi .tail{transform-origin:88px 88px}
.toshi.wag .tail{animation:wag .18s 5 alternate}
.toshi.hop{animation:hop .5s}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes hop{30%{transform:translateY(-10px)}}

/* SVG fills */
.t-fur{fill:var(--toshi)} .t-ear{fill:var(--toshi-dark)} .t-belly{fill:var(--cream)}
.t-nose,.t-eye{fill:var(--ink)} .t-shine{fill:var(--paper)}
.t-line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.a-bandana{fill:var(--coral)} .a-glass{fill:var(--ink);opacity:.88} .a-bow{fill:var(--pink)}
.a-hat{fill:var(--blue)} .a-pom{fill:var(--sun)} .a-crown{fill:var(--sun);stroke:var(--toshi-dark);stroke-width:1.5;stroke-linejoin:round} .a-scarf{fill:var(--grass)}
.clk-face{fill:var(--paper);stroke:var(--ink);stroke-width:6}
.clk-tick{stroke:var(--muted);stroke-width:2} .clk-tick.big{stroke:var(--ink);stroke-width:4}
.clk-num{font-family:var(--f-display);font-weight:700;font-size:22px;fill:var(--ink)}
.clk-h{stroke:var(--coral);stroke-width:9;stroke-linecap:round} .clk-m{stroke:var(--blue);stroke-width:6;stroke-linecap:round}
.clk-dot{fill:var(--ink)}
.blk-flat{fill:var(--blue)} .blk-rod{fill:var(--grass)} .blk-one{fill:var(--sun)}
.blk-grid{stroke:var(--paper);stroke-width:.8;fill:none}
.coin-p{fill:#C9814F;stroke:#8E5530} .coin-s{fill:#D3D8DF;stroke:#8C96A3}
.coin-v{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.coin-n{font-size:10px;font-family:var(--f-body);fill:var(--muted)}

/* v2 additions */
.speak{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--sky);font-weight:700;font-size:16px;color:var(--ink)}
.speak:active{transform:translateY(1px)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.week{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.week .d{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.week .d.hit{background:var(--grass);color:#fff;box-shadow:none}
.week .d.part{background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun);color:var(--toshi-dark)}
.week .d.today{outline:2px solid var(--ink);outline-offset:2px}
.week .lbl{font-weight:700;font-size:15px;margin-left:4px}
.newtag{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sun-soft);color:var(--toshi-dark)}
.tf-cell{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.tf-a{fill:var(--coral)} .tf-b{fill:var(--blue)}
.nl-line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.nl-tick{stroke:var(--ink);stroke-width:2}
.nl-num{font-family:var(--f-display);font-weight:600;font-size:15px;fill:var(--ink)}
.nl-num.key{font-size:18px;font-weight:700}
.nl-arc{fill:none;stroke:var(--coral);stroke-width:3;stroke-dasharray:6 5}
.nl-lab{font-family:var(--f-display);font-weight:700;font-size:20px;fill:var(--coral)}
.nl-q{font-family:var(--f-display);font-weight:700;font-size:22px;fill:var(--blue)}
.fb.slow{background:var(--sky);color:var(--ink);text-align:left}
.talk{background:var(--sun-soft);border-radius:16px;padding:14px 16px;font-size:18px;text-align:left;-webkit-user-select:text;user-select:text}
.paper ol{margin:0;padding-left:28px;display:flex;flex-direction:column;gap:8px;font-size:17px;-webkit-user-select:text;user-select:text}
.paper .a{color:var(--ok);font-weight:700;margin-left:8px}

/* CBA #3 review */
.go.cba{background:var(--blue);box-shadow:0 6px 0 #2F5FA8;font-size:24px;padding:16px;margin-top:-4px;flex-wrap:wrap}
.go.cba:active{box-shadow:0 2px 0 #2F5FA8}
.nextbtn:disabled{opacity:.4;cursor:default}
.choices.long{grid-template-columns:minmax(0,1fr);max-width:600px}
.choices.long button{font-family:var(--f-body);font-size:20px;font-weight:700;line-height:1.35;text-align:left;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.choices.long .ltr{font-family:var(--f-display);color:var(--muted);flex:none}
.choices.long button.sel{background:var(--sun-soft);box-shadow:0 4px 0 var(--sun),inset 0 0 0 2px var(--sun)}
.plan{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.plan-title{font-weight:700;font-size:18px;color:var(--toshi-dark)}
.eq-done{font-weight:700;font-size:18px;color:var(--ok);font-variant-numeric:tabular-nums}
.bm{width:100%;max-width:420px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bm-top,.bm-part{min-height:60px;display:flex;align-items:center;justify-content:center}
.bm-parts{display:flex;border-top:3px solid var(--ink)}
.bm-part{flex:1 1 0;min-width:0}
.bm-part+.bm-part{border-left:3px solid var(--ink)}
.bm .active{background:var(--sun-soft);box-shadow:inset 0 0 0 3px var(--sun)}
.bm .q{color:var(--blue)}
.tokens{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tokens button{min-width:76px;height:64px;padding:0 12px;border-radius:16px;background:var(--paper);font-family:var(--f-display);font-size:30px;font-weight:700;box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line);font-variant-numeric:tabular-nums}
.tokens button:disabled{opacity:.3}
.eqn{font-family:var(--f-display);font-size:clamp(26px,6vw,36px);font-weight:700;font-variant-numeric:tabular-nums}
.ops{display:flex;gap:16px}
.ops button{width:96px;height:80px;border-radius:16px;background:var(--paper);font-family:var(--f-display);font-size:44px;font-weight:700;box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}
.ops button:disabled{opacity:.3}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(31,45,61,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .35s}
.modal h2{font-size:28px;color:var(--toshi-dark)}
.modal .big-em{font-size:56px;line-height:1}
.modal .toshi{width:140px;height:auto}
@keyframes pop{from{transform:scale(.85);opacity:.4}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:11}

/* Grown-ups */
.gate{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.gate input{font:inherit;font-size:30px;width:140px;text-align:center;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.dash h2{font-size:22px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--sun)} .chart .bar.hit{fill:var(--grass)}
.chart .goal{stroke:var(--coral);stroke-width:2;stroke-dasharray:6 5}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.chart .gl{fill:var(--coral);font-weight:700}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.acc{display:inline-block;min-width:48px;padding:2px 8px;border-radius:999px;font-weight:700;text-align:center}
.acc.g{background:var(--ok-soft);color:var(--ok)} .acc.y{background:var(--sun-soft);color:var(--toshi-dark)} .acc.r{background:var(--coral-soft);color:var(--coral)} .acc.n{background:var(--sky);color:var(--muted)}
.dots{display:inline-flex;gap:3px} .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)} .dots i.y{background:var(--ok)} .dots i.n{background:var(--coral)}
.seg{display:inline-flex;background:var(--sky);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 14px;border-radius:10px;font-weight:700}
.seg button.on{background:var(--paper);box-shadow:0 1px 0 var(--line)}
.danger{padding:10px 14px;border-radius:12px;background:var(--coral-soft);color:var(--coral);font-weight:700}
.note{color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:15px;padding:8px 0}

@media (max-width:560px){
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .today{grid-template-columns:1fr;justify-items:center;text-align:center}
  .stats{justify-content:center}
  .ring{width:120px;height:120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div id="modal-root"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const TOPICS=['facts','addsub','place','money','time','word','cba'];
const TOPIC_ICO={facts:'⚡',addsub:'➕',place:'🧱',money:'🪙',time:'⏰',word:'📖',cba:'🎯'};
const STEPS_PER_STOP=8;
const IDLE_MS=90000;
const LS_STATE='tmw-state-v1', LS_DAYS='tmw-days-v1';
const LANDMARKS=[
  {em:'🏡',en:'Home',jp:'おうち'},
  {em:'🌳',en:'Park',jp:'こうえん'},
  {em:'🦆',en:'Duck Pond',jp:'あひるの いけ'},
  {em:'🥐',en:'Bakery',jp:'パンや'},
  {em:'📚',en:'Library',jp:'としょかん'},
  {em:'🚒',en:'Fire Station',jp:'しょうぼうしょ'},
  {em:'🏖️',en:'Beach',jp:'うみ'},
  {em:'🐄',en:'Farm',jp:'ぼくじょう'},
  {em:'⛰️',en:'Big Hill',jp:'おおきな おか'},
  {em:'🚀',en:'Space Camp',jp:'うちゅう きち'}
];
const ITEMS=[
  {id:'bandana',em:'🧣',en:'Red bandana',jp:'あかい バンダナ'},

const writers={};
function dbWrite(path,data){
  if(!store.db)return;
  const w=writers[path]||(writers[path]={busy:false,pending:null});
  w.pending=data;
  if(w.busy)return;
  w.busy=true;setSync('saving');
  (async()=>{
    while(w.pending){
      const d=w.pending;w.pending=null;
      try{await store.db.doc(path).set(d);setSync('saved');}
      catch(e){
        if(e&&e.code==='unavailable'){
          await sleep(700+Math.random()*900);
          try{await store.db.doc(path).set(d);setSync('saved');}catch(e2){setSync('error');}
        }else setSync('error');
      }
    }
    w.busy=false;
  })();
}
function saveAll(){
  state.updatedAt=Date.now();
  saveLocal();
  dbWrite('progress/player',clone(state));
  dbWrite('days/'+day.date,clone(day));
}
function setSync(s){store.sync=s;const el=document.getElementById('sync');if(el)el.textContent=T().sync[s];}

async function initDb(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){setSync('local');return;}
  let db=null;
  try{db=await c.use('db');}catch(e){db=null;}
  if(!db){setSync('local');return;}
  store.db=db;
  try{
    const p=await db.doc('progress/player').get();
    let pushLocal=false;
    if(p.exists){
      const r=p.data();
      if((r.updatedAt||0)>=(state.updatedAt||0))state=normalize(clone(r));
      else pushLocal=true;
    }else if(state.updatedAt)pushLocal=true;
    const qs=await db.collection('days').orderBy('date','desc').limit(60).get();
    qs.docs.forEach(d=>{
      const r=d.data();if(!r||!r.date)return;
      const loc=daysCache[r.date];
      if(!loc||(r.sec||0)>=(loc.sec||0))daysCache[r.date]=clone(r);
    });
    const remoteToday=daysCache[day.date];
    if(remoteToday&&(remoteToday.sec||0)>day.sec){
      day=clone(remoteToday);
      if(session&&sessionInDay){day.sessions.push(session);}
    }
    setSync('saved');
    if(pushLocal)saveAll();
    if(screen==='home'||screen==='parents')render();
  }catch(e){setSync('error');}
}

function genFacts(l){
  if(l===1){const a=R(0,10),b=R(0,10-a);return {type:'arith',a,b,op:'+',ans:a+b};}
  if(l===2){const a=R(2,10),b=R(Math.max(1,11-a),10);return {type:'arith',a,b,op:'+',ans:a+b};}
  if(l===3){const c=R(6,20),b=R(1,Math.min(10,c));return {type:'arith',a:c,b,op:'-',ans:c-b};}
  if(l===4){const a=R(1,10),c=R(a+1,Math.min(20,a+10));return {type:'missing',a,c,ans:c-a};}
  const a=R(1,9),b=R(1,9),c=R(1,Math.max(1,Math.min(9,20-a-b)));
  return {type:'arith3',a,b,c,ans:a+b+c};
}
function genAddSub(l){
  let a=0,b=0,op='+';
  const o=x=>x%10, t=x=>Math.floor(x/10)%10;
  for(let i=0;i<300;i++){
    if(l===1){op=pick(['+','-']);a=R(11,89);b=R(1,9);
      if(op==='+'&&o(a)+b<10)break; if(op==='-'&&o(a)>=b)break;}
    else if(l===2){op=pick(['+','-']);a=R(11,89);b=R(10,89);
      if(op==='+'&&o(a)+o(b)<10&&a+b<100)break; if(op==='-'&&a>b&&o(a)>=o(b))break;}
    else if(l===3){op='+';a=R(11,89);b=R(11,89);if(o(a)+o(b)>=10&&a+b<100)break;}
    else if(l===4){op='-';a=R(21,99);b=R(11,a-1);if(o(a)<o(b))break;}
    else{op=pick(['+','-']);a=R(110,899);b=R(10,399);
      if(op==='+'&&a+b<1000&&(o(a)+o(b)>=10||t(a)+t(b)>=10))break;
      if(op==='-'&&a>b&&(o(a)<o(b)||t(a)<t(b)))break;}
  }
  return {type:'arith',a,b,op,ans:op==='+'?a+b:a-b,col:true};
}
function genPlace(l){
  if(l===1){const t=R(1,9),o=R(0,9);return {type:'pv_blocks',h:0,t,o,ans:t*10+o};}
  if(l===2){const h=R(1,9),t=R(0,9),o=R(0,9);return {type:'pv_blocks',h,t,o,ans:h*100+t*10+o};}
  if(l===3){
    if(Math.random()<.5){const h=R(1,9),t=R(0,9),o=R(0,9);return {type:'pv_expanded',h,t,o,ans:h*100+t*10+o};}
    for(;;){const n=R(102,987),pos=pick([0,1,2]),pv=[100,10,1][pos],d=Math.floor(n/pv)%10;
      if(d!==0&&String(n).split('').filter(x=>x===String(d)).length===1)return {type:'pv_value',n,pos,d,ans:d*pv};}
  }
  if(l===4){
    const x=R(100,999);let y;const m=R(0,3);
    if(m===0)y=x;else if(m===1){const s=String(x);y=Number(s[0]+s[2]+s[1]);}else y=R(100,999);
    return {type:'pv_compare',x,y,ans:x<y?'<':x>y?'>':'=',choices:['<','=','>']};
  }
  const n=R(110,889),d=pick([10,-10,100,-100]);return {type:'pv_more',n,d,ans:n+d};
}
function coinsOf(q,d,n,p){return [].concat(Array(q).fill(25),Array(d).fill(10),Array(n).fill(5),Array(p).fill(1));}
function genMoney(l){
  if(l===1){const n=R(1,3),p=R(1,5);return {type:'coins',coins:coinsOf(0,0,n,p),ans:n*5+p};}
  if(l===2){const d=R(1,3),n=R(0,2),p=R(0,4);return {type:'coins',coins:coinsOf(0,d,n,p),ans:d*10+n*5+p};}
  if(l===3||l===5){for(;;){const q=R(1,3),d=R(0,3),n=R(0,2),p=R(0,4),tot=q*25+d*10+n*5+p;
    if(tot<=100){const c=coinsOf(q,d,n,p);return {type:'coins',coins:l===5?shuffle(c):c,ans:tot};}}}
  const have=pick([50,75,99,100]),cost=R(12,have-5);return {type:'change',have,cost,ans:have-cost};
}
function timeChoices(h,m,orig){
  const wrap=x=>((x-1+120)%12)+1;
  const right=fmtT(h,m);const set=new Set([right]);
  const cand=[fmtT(wrap(h+1),m),fmtT(wrap(h-1),m),fmtT(wrap(m/5||12),(h*5)%60),fmtT(h,(m+30)%60)];
  if(m>0)cand.push(fmtT(h,m/5));
  if(orig)cand.push(fmtT(orig.h,orig.m));
  for(const c of shuffle(cand)){if(set.size>=4)break;set.add(c);}
  while(set.size<4)set.add(fmtT(R(1,12),R(0,11)*5));
  return shuffle([...set]);
}
function genTime(l){
  const h=R(1,12);let m;
  if(l===5&&Math.random()<.5){
    const add=pick([15,30,60]);m=pick([0,15,30,45]);
    const tot=h*60+m+add;const nh=((Math.floor(tot/60)-1)%12)+1,nm=tot%60;
    return {type:'elapsed',h,m,add,ans:fmtT(nh,nm),choices:timeChoices(nh,nm,{h,m})};
  }
  if(l===1)m=0;else if(l===2)m=pick([0,30]);else if(l===3)m=pick([0,15,30,45]);
  else if(l===4)m=R(0,11)*5;else m=pick([40,45,50,55,5,10,R(0,11)*5]);
  return {type:'clock',h,m,ans:fmtT(h,m),choices:timeChoices(h,m)};
}
function genWord(l){
  const oi=R(0,OBJS.length-1);
  let A=pick(NAMES);const B=pick(NAMES.filter(n=>n!==A));
  if(OBJS[oi].en==='dog treats')A={en:'Toshi',jp:'Toshi'};
  let kind,a,b,c=0;
  if(l===1){kind='join';a=R(2,12);b=R(1,20-a);}
  else if(l===2){kind='sep';a=R(15,50);b=R(1,Math.max(1,a%10));}
  else if(l===3){kind=pick(['join','sep']);if(kind==='join'){a=R(15,60);b=R(15,99-a);}else{a=R(30,99);b=R(11,a-5);}}
  else if(l===4){kind='cmp';a=R(20,99);b=R(10,a-1);}
  else{kind='two';a=R(20,60);b=R(5,30);c=R(5,a+b-5);}
  const ans=kind==='join'?a+b:kind==='two'?a+b-c:a-b;
  return {type:'word',kind,o:oi,A,B,a,b,c,ans};
}

function wantRegroup(l){return l<=1?false:l===2?Math.random()<.5:Math.random()<.8;}
function subPair(l){

function toDirect(p){

  if(p.plans.length>1)c.push(p.plans[0].res);
  if(pl.nums.length>2)c.push(ans-pl.nums[pl.nums.length-1]);
  c.push(ans+10,ans-10,ans+1,ans-1,ans+2,ans-2);

  for(const x of c){if(x>0&&x<=99&&!seen.has(x)&&wrong.length<3){seen.add(x);wrong.push(x);}}
  return {type:'pick',skill:p.skill,prompt:p.text,ans:String(ans),choices:shuffle([ans,...wrong].map(String)),plans:p.plans,lab:p.lab,talk:p.talk,hintText:''};
}
function planProblem(skill,text,plans,l,talk){

function label(p){
  if(p.lab)return p.lab;
  const op=p.op==='-'?'−':'+';
  switch(p.type){
    case 'arith':return `${p.a} ${op} ${p.b}`;
    case 'arith3':return `${p.a} + ${p.b} + ${p.c}`;
    case 'missing':return `${p.a} + ? = ${p.c}`;
    case 'pv_blocks':return `blocks → ${p.ans}`;
    case 'pv_expanded':return `${p.h*100} + ${p.t*10} + ${p.o}`;
    case 'pv_value':return `value of ${p.d} in ${p.n}`;
    case 'pv_compare':return `${p.x} ○ ${p.y}`;
    case 'pv_more':return `${Math.abs(p.d)} ${p.d>0?'more':'less'} than ${p.n}`;
    case 'coins':return `coins = ${p.ans}¢`;
    case 'change':return `${money(p.have)} − ${p.cost}¢`;
    case 'clock':return `clock ${p.ans}`;
    case 'elapsed':return `${fmtT(p.h,p.m)} + ${p.add} min`;
    case 'word':return `story: ${wordEq(p)}`;
  }
  return '?';
}
function wordEq(p){
  if(p.kind==='join')return `${p.a} + ${p.b} = ${p.ans}`;
  if(p.kind==='two')return `${p.a} + ${p.b} − ${p.c} = ${p.ans}`;
  return `${p.a} − ${p.b} = ${p.ans}`;
}
function wordText(p,lang){
  const o=OBJS[p.o],l=lang||L(),A=p.A[l],B=p.B[l];
  if(l==='en'){
    if(p.kind==='join')return `${A} has ${p.a} ${o.en}. ${B} gives ${A} ${p.b} more. How many ${o.en} does ${A} have now?`;
    if(p.kind==='sep')return `${A} has ${p.a} ${o.en}. ${A} gives ${p.b} to ${B}. How many ${o.en} does ${A} have left?`;
    if(p.kind==='cmp')return `${A} has ${p.a} ${o.en}. ${B} has ${p.b} ${o.en}. How many more ${o.en} does ${A} have than ${B}?`;
    return `${A} has ${p.a} ${o.en}. ${B} gives ${A} ${p.b} more. Then ${A} gives ${p.c} to a friend. How many ${o.en} does ${A} have now?`;
  }
  if(p.kind==='join')return `${A}は ${o.jp}を ${p.a}${o.c} もっています。${B}が ${p.b}${o.c} くれました。${A}の ${o.jp}は ぜんぶで ${o.q}？`;
  if(p.kind==='sep')return `${A}は ${o.jp}を ${p.a}${o.c} もっています。${B}に ${p.b}${o.c} あげました。のこりは ${o.q}？`;

function planAdvance(keepFb){
  const p=cur.p;
  if(cur.si<p.stages.length-1)cur.si++;
  else{cur.pi++;cur.si=0;cur.fill=[];}
  cur.input='';cur.stageTries=0;cur.slotTries=0;cur.opWrong=null;
  if(!keepFb)cur.fb=null;
  renderPlay();
}
function tapToken(raw){
  if(!cur||cur.done||planStage()!=='bar')return;
  const pl=curPlan(),v=raw==='?'?'?':Number(raw),idx=cur.fill.length,slots=pl.parts.length+1;
  const good=idx===0?v===pl.whole:barLeft(pl).includes(v);
  if(good){
    sfx.tap();cur.fill.push(v);cur.slotTries=0;cur.fb=null;
    if(cur.fill.length===slots)planAdvance();else renderPlay();
    return;
  }
  sfx.no();cur.slotTries++;if(cur.slotTries===1)cur.slips++;
  const msg=idx===0?'The top of the bar is the WHOLE: all of them together. If the story does not tell you the whole, tap ?':'The parts go together to make the whole. Which number is one part?';
  if(cur.slotTries>=2){
    cur.fill.push(idx===0?pl.whole:barLeft(pl)[0]);cur.slotTries=0;
    cur.fb={kind:'try',msg:'Toshi filled that one in. '+msg};
    if(cur.fill.length===slots){planAdvance(true);return;}
  }else cur.fb={kind:'try',msg};
  renderPlay();
}
function tapOp(o){
  if(!cur||cur.done||planStage()!=='op'||cur.opWrong===o)return;
  const pl=curPlan();
  if(o===pl.op){sfx.tap();planAdvance();return;}
  sfx.no();cur.slips++;cur.opWrong=o;
  cur.fb={kind:'try',msg:pl.whole==='?'?'The ? is the whole, so put the parts together. Add!':'The ? is a part, so take the part you know away from the whole. Subtract!'};
  renderPlay();
}
function planMidSolve(val){
  const pl=curPlan();
  if(Number(val)===pl.res){sfx.ok();cur.doneEqs.push(eqStr(pl));planAdvance();return;}
  sfx.no();cur.stageTries++;if(cur.stageTries===1)cur.slips++;cur.input='';
  if(cur.stageTries>=2){cur.doneEqs.push(eqStr(pl));cur.fb={kind:'reveal'};renderPlay();}
  else{cur.fb={kind:'try',msg:pl.op==='+'?S.en.hint.colAdd:S.en.hint.colSub};renderPlay(true);}
}
function barHTML(pl){
  const active=planStage()==='bar'&&!cur.done?cur.fill.length:-1;
  const cell=(i,cls)=>{const v=cur.fill[i];return `<div class="${cls} ${i===active?'active':''} ${v==='?'?'q':''}">${v===undefined?'':v}</div>`;};
  return `<div class="bm" role="img" aria-label="bar model"><div class="bm-top ${0===active?'active':''} ${cur.fill[0]==='?'?'q':''}">${cur.fill[0]===undefined?'':cur.fill[0]}</div><div class="bm-parts">${pl.parts.map((_,i)=>cell(i+1,'bm-part')).join('')}</div></div>`;
}
function planPanel(){
  const p=cur.p,pl=curPlan(),st=planStage(),opS=pl.op==='+'?'+':MINUS;
  let h='<div class="plan">';
  if(p.plans.length>1)h+=`<div class="plan-title">Step ${cur.pi+1} of ${p.plans.length}</div>`;
  h+=cur.doneEqs.filter(()=>!isReveal()).map(e=>`<div class="eq-done">✓ ${e}</div>`).join('');
  if(p.stages.includes('bar'))h+=barHTML(pl);
  if(st==='bar'&&!cur.done){
    const need=cur.fill.length===0?'Plan: tap the number for the top of the bar.':'Now tap the number for this part.';
    const used=v=>cur.fill.filter(x=>x===v).length>=[pl.whole,...pl.parts].filter(x=>x===v).length&&cur.fill.includes(v);
    h+=`<div class="plan-title">${need}</div><div class="tokens">${pl.tokens.map(v=>`<button data-token="${v}" ${used(v)?'disabled':''}>${v}</button>`).join('')}</div>`;
  }else if(st==='op'&&!cur.done){
    h+=`<div class="plan-title">Add or subtract?</div><div class="eqn">${pl.nums.join(' ○ ')} = ?</div><div class="ops">${['+','-'].map(o=>`<button data-op="${o}" ${cur.opWrong===o?'disabled':''} aria-label="${o==='+'?'add':'subtract'}">${o==='+'?'+':MINUS}</button>`).join('')}</div>`;
  }else{
    h+=`<div class="eqn">${pl.nums.join(` ${opS} `)} = ${isReveal()||(cur.done&&cur.fb&&cur.fb.kind==='ok')?pl.res:'?'}</div>`;
  }
  return h+'</div>';
}
function recordSkill(p,first){
  if(!p.skill)return;
  const s=state.cba[p.skill]||(state.cba[p.skill]={n:0,ok:0,r:[]});
  s.n++;if(first)s.ok++;s.r.push(first?1:0);if(s.r.length>8)s.r.shift();
}
let fastWrongs=0;
function submit(val){
  if(!cur||cur.done||Date.now()<cur.lockUntil)return;
  const p=cur.p;
  if(typeof p.ans==='number'&&String(val)==='')return;
  if(p.type==='plan'&&cur.pi<p.plans.length-1){planMidSolve(val);return;}
  const correct=typeof p.ans==='number'?Number(val)===p.ans:val===p.ans;
  const fast=Date.now()-cur.shownAt<(p.type==='pick'||p.type==='multi'?4000:typeof p.ans==='number'?2500:1500);
  cur.tries++;
  if(correct){fastWrongs=0;finish(true,val);return;}
  fastWrongs=fast?fastWrongs+1:0;
  sfx.no();
  if(cur.tries<2){
    if(typeof p.ans!=='number')cur.disabled.push(val);else cur.input='';
    if(p.type==='multi')cur.sel=[];
    if(fastWrongs>=2){
      fastWrongs=0;cur.fb={kind:'slow'};cur.lockUntil=Date.now()+3000;
      setTimeout(()=>{if(cur&&cur.fb&&cur.fb.kind==='slow'&&screen==='play'){cur.shownAt=Date.now();renderPlay();}},3050);
    }else cur.fb={kind:'try'};
    renderPlay(true);
  }else finish(false,val);
}
function finish(correct,val){
  const p=cur.p;cur.done=true;cur.picked=val;
  const first=correct&&cur.tries===1&&!cur.slips;
  recordSkill(p,first);
  const TT=state.topics[p.topic];
  TT.n++;if(first)TT.ok++;
  TT.recent.push(first?1:0);if(TT.recent.length>8)TT.recent.shift();
  if(mode!=='mix')TT.solo=(TT.solo||0)+1;
  state.last.push({p:clone(p),first});if(state.last.length>8)state.last.shift();
  day.q++;if(first)day.ok++;
  const bt=day.byTopic[p.topic]||(day.byTopic[p.topic]={q:0,ok:0});bt.q++;if(first)bt.ok++;
  if(session){session.q++;if(first)session.ok++;}
  const key=label(p);const mi=state.missed.findIndex(m=>label(m.p)===key);
  if(!first){
    state.missCounts[key]=(state.missCounts[key]||0)+1;
    const ks=Object.keys(state.missCounts);
    if(ks.length>60){ks.sort((a,b)=>state.missCounts[a]-state.missCounts[b]).slice(0,ks.length-60).forEach(k=>delete state.missCounts[k]);}
    if(mi<0){state.missed.push({p:clone(p),due:state.qCount+3,hits:0});if(state.missed.length>25)state.missed.shift();}
    else{state.missed[mi].due=state.qCount+4;state.missed[mi].hits=0;}
  }else if(mi>=0){
    const m=state.missed[mi];m.hits++;if(m.hits>=2)state.missed.splice(mi,1);else m.due=state.qCount+8;
  }
  let lvlMsg=null;const name=T().topics[p.topic];
  const r=TT.recent;
  if(r.length>=7&&r.slice(-7).filter(x=>x===1).length>=6&&r[r.length-1]===1&&TT.lvl<5){TT.lvl++;TT.recent=[];lvlMsg=T().levelUp(name,TT.lvl);}
  else if(r.length>=4&&r.slice(-4).filter(x=>x===0).length>=3&&TT.lvl>1){TT.lvl--;TT.recent=[];lvlMsg=T().levelDown(name,TT.lvl);}
  let reached=null;
  if(correct){
    state.bones+=first?2:1;state.steps++;
    if(state.steps%STEPS_PER_STOP===0){
      const k=state.steps/STEPS_PER_STOP;
      const lm=LANDMARKS[k%LANDMARKS.length];
      let item=null,bonus=0;
      if(k<=ITEMS.length){item=ITEMS[k-1];if(!state.wear.includes(item.id))state.wear.push(item.id);}
      else{bonus=5;state.bones+=bonus;}
      reached={lm,item,bonus};
    }
  }
  saveAll();
  cur.fb={kind:correct?'ok':'no',lvlMsg,praise:pick(T().great)};
  if(correct)sfx.ok();
  renderPlay();
  if(correct){
    const walker=document.querySelector('.walker .toshi');if(walker){walker.classList.add('wag','hop');}
    if(reached){setTimeout(()=>showReached(reached),650);}
    else if(!lvlMsg){advanceTimer=setTimeout(nextQuestion,1300);}
  }
}

/* ---------- time tracking ---------- */
function startSession(){session={t:nowHM(),sec:0,q:0,ok:0};sessionInDay=false;}
function endSession(){session=null;sessionInDay=false;saveAll();}
function tick(){
  const today=todayStr();
  if(today!==day.date){saveAll();day=daysCache[today]?clone(daysCache[today]):newDay(today);if(session){startSession();}}
  const active=screen==='play'&&!document.hidden&&Date.now()-lastTap<IDLE_MS&&!document.querySelector('.modal');
  if(active){
    day.sec++;
    if(session){session.sec++;if(!sessionInDay){day.sessions.push(session);sessionInDay=true;}}
    if(!day.goalHit&&day.sec>=state.goalMin*60){day.goalHit=true;saveAll();showGoal();}
  }
  if(active!==wasActive&&!active&&screen==='play')saveAll();
  wasActive=active;
  updateClock(active);
}
function updateClock(active){
  const el=document.getElementById('clockmini');if(!el)return;
  const goal=state.goalMin*60,pct=Math.min(100,day.sec/goal*100);
  el.querySelector('.now').textContent=T().minOf(Math.floor(day.sec/60),state.goalMin);
  el.querySelector('.of').textContent=active||screen!=='play'?'':T().paused;
  el.querySelector('.of').classList.toggle('paused',!active);
  const m=el.querySelector('.meter');m.classList.toggle('done',day.goalHit);m.querySelector('i').style.width=pct+'%';
}

function lvlDots(l){return `<span class="lvl" aria-label="level ${l}">${[1,2,3,4,5].map(i=>`<i class="${i<=l?'on':''}"></i>`).join('')}</span>`;}
function weekDays(){
  const all=Object.assign({},daysCache,{[day.date]:day});
  const d=new Date();const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);
  const days=[];let hits=0;const today=todayStr();
  for(let i=0;i<7;i++){const k=todayStr(d),r=all[k]||{};if(r.goalHit)hits++;
    days.push({lbl:'MTWTFSS'[i],hit:!!r.goalHit,sec:r.sec||0,today:k===today});d.setDate(d.getDate()+1);}
  return {days,hits};
}
function streak(){
  const all=Object.assign({},daysCache,{[day.date]:day});
  let n=0;const d=new Date();
  if(!(all[todayStr(d)]&&all[todayStr(d)].goalHit))d.setDate(d.getDate()-1);
  for(;;){const k=todayStr(d);if(all[k]&&all[k].goalHit){n++;d.setDate(d.getDate()-1);}else break;}
  return n;
}

function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const ctx=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#FFC83A','#4A965A','#E8604F','#4A82D4','#EE88AE'];
  const ps=Array.from({length:90},()=>({x:Math.random()*W,y:-20-Math.random()*H*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:6+Math.random()*6,c:pick(cols)}));
  let f=0;(function loop(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<150)requestAnimationFrame(loop);else c.remove();})();
}

/* ---------- grown-ups ---------- */
let gateQ=null,confirmReset=false,paperSet=null,paperShow=false;
function coinWords(coins){const n={25:'quarter',10:'dime',5:'nickel',1:'penny'},pl={25:'quarters',10:'dimes',5:'nickels',1:'pennies'};
  return [25,10,5,1].map(v=>{const k=coins.filter(c=>c===v).length;return k?`${k} ${k===1?n[v]:pl[v]}`:'';}).filter(Boolean).join(', ');}
function paperItem(p){
  const op=p.op==='-'?'−':'+';
  switch(p.type){
    case 'arith':return {q:`${p.a} ${op} ${p.b} = ____`,a:p.ans};
    case 'arith3':return {q:`${p.a} + ${p.b} + ${p.c} = ____`,a:p.ans};
    case 'missing':return {q:`${p.a} + ____ = ${p.c}`,a:p.ans};
    case 'pv_blocks':return {q:`Write the number: ${p.h?p.h+(p.h===1?' hundred, ':' hundreds, '):''}${p.t} ${p.t===1?'ten':'tens'}, ${p.o} ${p.o===1?'one':'ones'}`,a:p.ans};
    case 'pv_expanded':return {q:`${p.h*100} + ${p.t*10} + ${p.o} = ____`,a:p.ans};
    case 'pv_value':return {q:`What is the value of the ${p.d} in ${p.n}?`,a:p.ans};
    case 'pv_compare':return {q:`Write <, > or =:  ${p.x} ____ ${p.y}`,a:p.ans};
    case 'pv_more':return {q:`What is ${Math.abs(p.d)} ${p.d>0?'more':'less'} than ${p.n}?`,a:p.ans};
    case 'coins':return {q:`How much money? ${coinWords(p.coins)}`,a:p.ans+'¢'};
    case 'change':return {q:`You have ${money(p.have)}. A toy costs ${money(p.cost)}. How much is left?`,a:p.ans+'¢'};
    case 'clock':return {q:`Draw a clock that shows ${p.ans}.`,a:'check the hands'};
    case 'elapsed':return {q:`It is ${fmtT(p.h,p.m)}. What time will it be in ${p.add===60?'1 hour':p.add+' minutes'}?`,a:p.ans};
    case 'word':return {q:wordText(p,'en'),a:p.ans};
    case 'plan':return {q:p.text+' <i>Draw a bar model, write an equation, and solve.</i>',a:p.plans.map(eqStr).join(', then ')};
    case 'pick':return {q:p.prompt+' '+p.choices.map((c,i)=>`<b>${'ABCD'[i]}.</b> ${c.split('|').join(', then ')}`).join(' '),a:'ABCD'[p.choices.indexOf(p.ans)]};
    case 'multi':return {q:p.prompt+' '+p.choices.map((c,i)=>`<b>${'ABCD'[i]}.</b> ${c}`).join(' '),a:p.ans.split('||').map(a=>'ABCD'[p.choices.indexOf(a)]).sort().join(' and ')};
    case 'hop':return {q:`Draw a number line and add up from ${p.b} to ${p.a}: ${p.a} − ${p.b} = ____`,a:p.ans};
  }
  return {q:'?',a:''};
}
function makePaper(){const out=[];TOPICS.forEach(t=>{for(let i=0;i<2;i++){const p=GEN[t](state.topics[t].lvl);p.topic=t;out.push(paperItem(p));}});return out;}
function renderGate(){
  gateQ=gateQ||{a:R(6,9),b:R(6,9)};
  app.innerHTML=`<div class="bar"><button class="homebtn" data-act="home" aria-label="home">🏠</button><h2 style="font-size:22px">Grown-ups</h2></div>
  <div class="card gate">
    <p>Grown-ups only. What is <b>${gateQ.a} × ${gateQ.b}</b>?</p>
    <form id="gateform" class="row" style="justify-content:center"><input id="gatein" inputmode="numeric" autocomplete="off" aria-label="answer"><button class="nextbtn" type="submit">Open</button></form>
    <p class="note" id="gatemsg"></p>
  </div>`;
  const f=document.getElementById('gateform');
  f.addEventListener('submit',e=>{e.preventDefault();const v=Number(document.getElementById('gatein').value);
    if(v===gateQ.a*gateQ.b){gateQ=null;screen='parents';render();}else{document.getElementById('gatemsg').textContent='Not quite. Try again.';}});
  setTimeout(()=>{const i=document.getElementById('gatein');if(i)i.focus();},50);
}
function accPill(ok,n){if(!n)return '<span class="acc n">—</span>';const a=Math.round(ok/n*100);return `<span class="acc ${a>=80?'g':a>=60?'y':'r'}">${a}%</span>`;}
function renderParents(){
  const all=Object.assign({},daysCache,{[day.date]:day});
  const goal=state.goalMin;
  const days14=[];const d=new Date();d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){const k=todayStr(d);days14.push({k,dd:d.getDate(),dow:'SMTWTFS'[d.getDay()],min:((all[k]&&all[k].sec)||0)/60,hit:!!(all[k]&&all[k].goalHit)});d.setDate(d.getDate()+1);}
  const week=days14.slice(-7).reduce((a,b)=>a+b.min,0);
  const daysMet7=days14.slice(-7).filter(x=>x.hit).length;
  // chart
  const W=640,H=220,padL=34,padB=34,padT=14,cw=W-padL-10,ch=H-padB-padT;
  const maxV=Math.max(goal*1.5,...days14.map(x=>x.min));const top=Math.ceil(maxV/5)*5;
  const y=v=>padT+ch-(v/top)*ch;const bw=cw/14;
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes per day, last 14 days">`;
  [0,Math.round(top/2),top].forEach(v=>{svg+=`<line class="grid" x1="${padL}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;});
  days14.forEach((x,i)=>{const bx=padL+i*bw+bw*.18,w=bw*.64,h=Math.max(0,ch-(y(x.min)-padT));
    if(x.min>0)svg+=`<rect class="bar ${x.hit?'hit':''}" x="${bx}" y="${y(x.min)}" width="${w}" height="${h}" rx="4"><title>${x.k}: ${x.min.toFixed(1)} min</title></rect>`;
    svg+=`<text x="${bx+w/2}" y="${H-18}" text-anchor="middle">${x.dd}</text><text x="${bx+w/2}" y="${H-4}" text-anchor="middle">${x.dow}</text>`;});
  svg+=`<line class="goal" x1="${padL}" x2="${W-10}" y1="${y(goal)}" y2="${y(goal)}"/><text class="gl" x="${W-12}" y="${y(goal)-6}" text-anchor="end">goal ${goal} min</text></svg>`;
  // sessions
  const sess=[];Object.keys(all).sort().reverse().forEach(k=>{(all[k].sessions||[]).slice().reverse().forEach(s=>{if(sess.length<12)sess.push(Object.assign({date:k},s));});});
  const misses=Object.entries(state.missCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const lvlTopic=TOPICS.map(k=>{const tp=state.topics[k];const today=day.byTopic[k]||{q:0,ok:0};return {k,tp,today};});
  app.innerHTML=`
  <div class="bar"><button class="homebtn" data-act="home" aria-label="home">🏠</button><h2 style="font-size:24px">Grown-ups</h2><span class="spacer"></span><span class="note" id="sync">${S.en.sync[store.sync]}</span></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${mmss(day.sec)}</div><div class="k">today · goal ${goal} min${day.goalHit?' ✓':''}</div></div>
    <div class="kpi"><div class="v">${Math.round(week)}</div><div class="k">minutes, last 7 days</div></div>
    <div class="kpi"><div class="v">${daysMet7}/7</div><div class="k">days goal met</div></div>
    <div class="kpi"><div class="v">${day.q?Math.round(day.ok/day.q*100)+'%':'—'}</div><div class="k">first-try right today (${day.q} q)</div></div>
  </div>
  <div class="card dash"><h2>Talk about it</h2><div class="talk">${talkPrompt()}</div><p class="note">Based on her latest walk. In a study of first graders, a few minutes of math talk with a parent each week was the biggest proven lever, more than any app.</p></div>
  <div class="card dash"><h2>Minutes per day</h2>${svg}<p class="note">Green bars hit the daily goal. Time counts only while a question screen is open and she has tapped in the last 90 seconds.</p></div>
  <div class="card dash"><h2>Sessions</h2>
    ${sess.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th>Start</th><th>Minutes</th><th>Questions</th><th>First-try right</th></tr></thead><tbody>
    ${sess.map(s=>`<tr><td>${s.date.slice(5)}</td><td>${s.t}</td><td>${(s.sec/60).toFixed(1)}</td><td>${s.q}</td><td>${accPill(s.ok,s.q)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No sessions yet. Each walk shows up here with its start time and minutes.</p>'}
  </div>
  <div class="card dash"><h2>Topics</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Topic</th><th>Level</th><th>All-time</th><th>Today</th><th>Last 8</th></tr></thead><tbody>
    ${lvlTopic.map(({k,tp,today})=>`<tr><td>${TOPIC_ICO[k]} ${S.en.topics[k]}</td><td>${lvlDots(tp.lvl)}</td><td>${accPill(tp.ok,tp.n)} <span class="note">${tp.n} q</span></td><td>${accPill(today.ok,today.q)}</td><td><span class="dots">${tp.recent.map(x=>`<i class="${x?'y':'n'}"></i>`).join('')}</span></td></tr>`).join('')}
  </tbody></table></div><p class="note">Levels go up after 6 of the last 7 are right on the first try (about 85%) and down after 3 misses in 4. Missed problems come back a few questions later until she gets them right twice. Mixed walk only uses topics she has practiced on their own (8 questions) or already leveled up.</p></div>
  <div class="card dash"><h2>CBA #3 Review, by problem type</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>Sheet #</th><th>Problem type</th><th>First-try right</th><th>Last 8</th></tr></thead><tbody>
    ${CBA_SKILLS.map(s=>{const r=state.cba[s.id]||{n:0,ok:0,r:[]};return `<tr><td>${s.q}</td><td>${s.name}</td><td>${accPill(r.ok,r.n)} <span class="note">${r.n} q</span></td><td><span class="dots">${r.r.map(x=>`<i class="${x?'y':'n'}"></i>`).join('')}</span></td></tr>`;}).join('')}
  </tbody></table></div><p class="note">First-try right means no mistakes on the bar, the add-or-subtract choice, or the answer. Weak types come up twice as often. Levels 1 to 3 have her build the bar model. Level 4 drops the bar. Level 5 is test style: multiple choice with no hints.</p></div>
  <div class="card dash paper"><h2>Paper check</h2>
    <p class="note">${state.paperAt?`Last check: ${todayStr(new Date(state.paperAt))}.`:'No paper check yet.'} Once a month, have her do these with pencil and paper, away from the screen. Progress in the app is not the same as understanding.</p>
    ${paperSet?`<ol>${paperSet.map(x=>`<li>${x.q}${paperShow?`<span class="a">${x.a}</span>`:''}</li>`).join('')}</ol>
      <div class="row" style="margin-top:12px"><button class="linkbtn" data-act="paper-ans">${paperShow?'Hide answers':'Show answers'}</button><button class="linkbtn" data-act="paper-new">New set</button></div>`
      :`<button class="nextbtn" data-act="paper-new">Make ${TOPICS.length*2} problems</button>`}
  </div>
  <div class="card dash"><h2>Trouble spots</h2>
    ${misses.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>Problem</th><th>Times missed</th></tr></thead><tbody>${misses.map(([k,n])=>`<tr><td>${k}</td><td>${n}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nothing missed yet.</p>'}
  </div>
  <div class="card dash"><h2>Settings</h2>
    <div class="row"><span>Daily goal</span><span class="seg">${[10,15,20,30].map(m=>`<button data-act="goal" data-min="${m}" class="${m===goal?'on':''}">${m} min</button>`).join('')}</span></div>
    <div class="row" style="margin-top:12px"><span>Read story problems aloud automatically</span><span class="seg"><button data-act="autoread" data-v="1" class="${state.autoRead!==false?'on':''}">On</button><button data-act="autoread" data-v="0" class="${state.autoRead===false?'on':''}">Off</button></span></div>
    <div class="row" style="margin-top:12px"><span>Language</span><span class="seg"><button data-act="setlang" data-l="en" class="${L()==='en'?'on':''}">English</button><button data-act="setlang" data-l="jp" class="${L()==='jp'?'on':''}">にほんご</button></span></div>
    <div class="row" style="margin-top:16px">${confirmReset
      ?`<span>Reset levels, bones, steps and Toshi's items? Time history stays.</span><button class="danger" data-act="reset-yes">Yes, reset</button><button class="linkbtn" data-act="reset-no">Cancel</button>`
      :`<button class="danger" data-act="reset">Reset progress…</button>`}</div>
  </div>`;
}

/* ---------- navigation + events ---------- */
function goHome(){
  clearTimeout(advanceTimer);try{canSpeak&&speechSynthesis.cancel();}catch(e){}
  const s=screen==='play'?session:null;
  if(screen==='play')endSession();
  screen='home';cur=null;modalRoot.innerHTML='';render();
  if(s&&s.q>=3)showWalkDone(s);
}
function showWalkDone(s){
  const t=T();
  showModal(`<div class="big-em">🐾</div><h2>${t.walkDone}</h2><p>${t.walkSub(s.q,s.ok)}</p>${toshiSVG(state.wear,'wag')}
    <div style="align-self:stretch;text-align:left"><b>${t.showGrownup}</b><div class="talk" style="margin-top:6px">${talkPrompt()}</div></div>
    <button class="nextbtn" data-m="ok">${t.ok}</button>`);
}
function startPlay(m){mode=m;screen='play';startSession();cur=null;nextQuestion();}

document.addEventListener('pointerdown',()=>{lastTap=Date.now();},true);
document.addEventListener('keydown',e=>{
  lastTap=Date.now();
  if(screen!=='play'||!cur||document.querySelector('.modal')||e.target.tagName==='INPUT')return;
  if(cur.done){if(e.key==='Enter'&&document.querySelector('[data-act="next"]'))nextQuestion();return;}
  const p=cur.p;
  if(isReveal()){if(e.key==='Enter')planAdvance();return;}
  if(p.type==='plan'&&planStage()!=='solve')return;
  if(p.type==='multi'){const i=Number(e.key)-1;if(i>=0&&i<p.choices.length)toggleSel(p.choices[i]);else if(e.key==='Enter'&&cur.sel.length===2)submit(cur.sel.slice().sort().join('||'));return;}
  if(typeof p.ans==='number'){
    if(/^[0-9]$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('del');else if(e.key==='Enter')pressKey('ok');
  }else{const i=Number(e.key)-1;if(i>=0&&i<p.choices.length&&!cur.disabled.includes(p.choices[i]))submit(p.choices[i]);}
});
function toggleSel(c){
  if(!cur||cur.done||Date.now()<cur.lockUntil)return;
  const i=cur.sel.indexOf(c);
  if(i>=0)cur.sel.splice(i,1);else{if(cur.sel.length>=2)cur.sel.shift();cur.sel.push(c);}
  if(cur.fb&&cur.fb.kind==='try')cur.fb=null;
  sfx.tap();renderPlay();
}
function pressKey(k){
  if(!cur||cur.done||Date.now()<cur.lockUntil||isReveal())return;
  if(k==='del')cur.input=cur.input.slice(0,-1);
  else if(k==='ok'){submit(cur.input);return;}
  else if(cur.input.length<4)cur.input=(cur.input==='0'?'':cur.input)+k;
  if(cur.fb&&cur.fb.kind==='try')cur.fb=null;
  const b=document.getElementById('ansbox');
  if(b){const unit=(cur.p.type==='coins'||cur.p.type==='change')?'<span>¢</span>':'';b.innerHTML=(cur.input||'<span class="ph">?</span>')+unit;}
  const f=document.querySelector('.fb.try');if(f&&!cur.fb)f.remove();
}
app.addEventListener('click',e=>{
  const key=e.target.closest('[data-key]');if(key){sfx.tap();pressKey(key.dataset.key);return;}
  const ch=e.target.closest('[data-choice]');if(ch&&!ch.disabled){submit(ch.dataset.choice);return;}
  const tk=e.target.closest('[data-token]');if(tk&&!tk.disabled){tapToken(tk.dataset.token);return;}
  const opb=e.target.closest('[data-op]');if(opb&&!opb.disabled){tapOp(opb.dataset.op);return;}
  const tg=e.target.closest('[data-toggle]');if(tg&&!tg.disabled){toggleSel(tg.dataset.toggle);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='play')startPlay(b.dataset.mode);
  else if(a==='home')goHome();
  else if(a==='next')nextQuestion();
  else if(a==='plan-next')planAdvance();
  else if(a==='multi-check'){if(cur&&cur.sel.length===2)submit(cur.sel.slice().sort().join('||'));}
  else if(a==='lang'){state.lang=L()==='en'?'jp':'en';saveAll();render();}
  else if(a==='setlang'){state.lang=b.dataset.l;saveAll();render();}
  else if(a==='sound'){state.sound=!state.sound;saveAll();render();}
  else if(a==='gate'){screen='gate';render();}
  else if(a==='wear'){const id=b.dataset.id;const i=state.wear.indexOf(id);if(i>=0)state.wear.splice(i,1);else state.wear.push(id);saveAll();render();}
  else if(a==='goal'){state.goalMin=Number(b.dataset.min);day.goalHit=day.sec>=state.goalMin*60;saveAll();render();}
  else if(a==='reset'){confirmReset=true;render();}
  else if(a==='reset-no'){confirmReset=false;render();}
  else if(a==='speak')speakQuestion();
  else if(a==='speak-ex'){if(cur)say(String(ansText(cur.p))+'. '+explain(cur.p));}
  else if(a==='paper-new'){paperSet=makePaper();paperShow=false;state.paperAt=Date.now();saveAll();render();}
  else if(a==='paper-ans'){paperShow=!paperShow;render();}
  else if(a==='autoread'){state.autoRead=b.dataset.v==='1';saveAll();render();}
  else if(a==='reset-yes'){const keep={lang:state.lang,sound:state.sound,goalMin:state.goalMin,autoRead:state.autoRead,paperAt:state.paperAt};state=Object.assign(defaultState(),keep);confirmReset=false;saveAll();render();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveAll();});
window.addEventListener('pagehide',()=>saveAll());

render();
setInterval(tick,1000);
initDb();
})();
</script>
